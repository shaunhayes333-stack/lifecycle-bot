name: Build AATE APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifecycle_apk
    
    permissions:
      contents: write  # Required for creating releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Compute AATE build number
        id: aate_build
        run: |
          # V5.0.6677 — mirror the root workflow's full-version authority.
          CANONICAL_VERSION="$(tr -d '[:space:]' < AATE_VERSION)"
          CANONICAL_BUILD_NUMBER="$(printf '%s' "$CANONICAL_VERSION" | awk -F. '{print $NF}')"
          BASE="$(printf '%s' "$CANONICAL_VERSION" | awk -F. '{print $1"."$2}')"
          RUN_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1))
          COMMIT_BUILD_NUMBER=$(git log -20 --pretty=%s | grep -oE 'V5\.0\.[0-9]+' | sed -E 's/V5\.0\.//' | sort -n | tail -1)
          if [ -z "$COMMIT_BUILD_NUMBER" ]; then COMMIT_BUILD_NUMBER=0; fi
          BUILD_NUMBER="$CANONICAL_BUILD_NUMBER"
          if [ "$RUN_BUILD_NUMBER" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER="$RUN_BUILD_NUMBER"; fi
          if [ "$COMMIT_BUILD_NUMBER" -gt "$BUILD_NUMBER" ]; then BUILD_NUMBER="$COMMIT_BUILD_NUMBER"; fi
          VERSION_NAME="${BASE}.${BUILD_NUMBER}"
          echo "AATE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "AATE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Release APK
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          echo "========================================"
          echo "Building AATE v${{ steps.aate_build.outputs.version_name }}"
          echo "versionCode = $((500 + AATE_BUILD_NUMBER))"
          echo "========================================"
          GRADLE_CMD="./gradlew"
          if ! ./gradlew --version --no-daemon; then
            echo "Gradle wrapper unavailable; falling back to system gradle"
            GRADLE_CMD="gradle"
            gradle --version
          fi
          $GRADLE_CMD clean assembleRelease --no-daemon --stacktrace -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME
          echo "Built APK:"
          ls -la app/build/outputs/apk/release/
          # Rename APK to include build number
          mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk
          echo "Final APK:"
          ls -la app/build/outputs/apk/release/

      # Upload as artifact (backup)
      - uses: actions/upload-artifact@v4
        with:
          name: AATE_v${{ steps.aate_build.outputs.version_name }}
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk

      # Create/Update "latest" release for easy public download
      - name: Delete old latest release
        continue-on-error: true
        run: |
          gh release delete latest --yes || true
          git push origin :refs/tags/latest || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .

      - name: Create Public Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "AATE Latest Build (v${{ steps.aate_build.outputs.version_name }})"
          body: |
            ## 📱 AATE v${{ steps.aate_build.outputs.version_name }}
            
            **Public Download Link** - No login required!
            
            ### 📥 Download
            Click the APK file below to download directly.
            
            ### ✨ Latest Changes
            - Build ${{ steps.aate_build.outputs.build_number }}
            - See commit history for details
            
            ### 📋 Requirements
            - Android 8.0+ (API 26)
            - Allow "Install from unknown sources" in settings
            
            ---
            🔗 **Share this link:** `https://github.com/${{ github.repository }}/releases/latest`
          files: lifecycle_apk/app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
