android.useAndroidX=true
android.enableJetifier=true

# V5.0.7082 — R8 ran out of heap at 4096m and it is a COIN TOSS, not a cliff.
#
# V5.0.7079 failed with:
#     Caused by: java.lang.OutOfMemoryError: Java heap space
#       at java.util.HashSet.add(HashSet.java:221)
#       at com.android.tools.r8.internal.Yc0.a(R8_8.3.37...)
#     A failure occurred while executing R8Task$R8Runnable
#     BUILD FAILED in 14m 57s
#
# and the log's own summary confirms it was not the compiler:
#     "(no 'e:' lines — failure was not a Kotlin compile error)"
#
# WHAT MAKES IT A COIN TOSS. V5.0.7079 changed no Kotlin at all — one Python
# validator, one workflow step, one version file. The IDENTICAL bytecode built
# and shipped green as V5.0.7078 minutes earlier, on the same runner image and
# the same heap. Same input, two outcomes: R8's peak is sitting right on the
# 4096m ceiling and whether it fits depends on GC timing and on what else the
# runner is doing. 7078 and 7079 overlapped, and 7079's log carries the
# evidence of that — three ReserveCacheError lines, "another job may be
# creating this cache".
#
# A build that fails half the time is worse than one that fails every time: it
# reads as flakiness to be retried rather than a ceiling to be raised, and
# retrying costs 15 minutes of R8 each attempt.
#
# 4096 -> 6144. GitHub's ubuntu-latest runner has 16 GB, the Kotlin compile
# daemon holds its own heap beside this one, and R8 with
# proguard-android-optimize.txt over ~1165 Kotlin files plus the library set is
# the peak consumer in the whole build. 6 GB leaves real headroom on both
# sides rather than trading one tight ceiling for another.
#
# NOT touched, deliberately: minifyEnabled and shrinkResources stay ON.
# Disabling R8 would "fix" this instantly and would also stop shrinking and
# obfuscation, which changes what reaches the device — reflection-reliant
# paths behave differently unminified. A memory ceiling is a memory problem,
# not a reason to ship a different artifact than the one that has been tested.
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
kotlin.code.style=official
