name: AATE 6683 Shadow Train Authority Repair

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V5.0.6683 repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/aate6683.py
          python3 /tmp/aate6683.py

      - name: Verify repair before commit
        shell: bash
        run: |
          grep -q 'EXEC_OPEN_BLOCKED_SHADOW_TRAIN_ONLY_6683' lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          ! grep -q 'EXEC_OPEN_SHADOW_TRAIN_SOFT_ALLOW' lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          grep -q 'shadowTrainOnly_6683CannotBeReopenedByLateExecPatch' lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt
          test -f lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6683ShadowTrainAuthorityTest.kt

      - name: Commit repair and remove helper
        shell: bash
        run: |
          git config user.name 'AATE CI Repair'
          git config user.email 'aate-ci-repair@users.noreply.github.com'
          rm .github/workflows/aate-6683-one-shot.yml
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt \
                  lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt \
                  lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6683ShadowTrainAuthorityTest.kt \
                  .github/workflows/aate-6683-one-shot.yml
          git commit -m 'V5.0.6683 restore shadow-train execution authority'
          git push origin main

      - name: Dispatch canonical build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
