name: V5.0.6695 Runtime Authority Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'V5.0.6695 run guarded runtime authority repair')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Apply guarded source transforms
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6695_runtime_authority_repair.py

      - name: Source contradiction and patch-rot scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Compile and run 6695 regression locks
        working-directory: lifecycle_apk
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests com.lifecyclebot.engine.Aate6695RuntimeAuthorityRepairTest --no-daemon --stacktrace

      - name: Commit repaired runtime source atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6695_runtime_authority_repair.yml
          git rm lifecycle_apk/ci/v5_0_6695_runtime_authority_repair.py
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/AssetClass.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/v3/scoring/ShitCoinTraderAI.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/CryptoAltTrader.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/TradeHistoryStore.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6695RuntimeAuthorityRepairTest.kt
          git diff --cached --check
          git commit -m "V5.0.6695 repair runtime authority chokes"
          git push origin HEAD:main
