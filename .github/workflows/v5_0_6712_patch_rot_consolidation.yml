name: V5.0.6712 Patch Rot Consolidation

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'apply 6712 patch rot consolidation')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply consolidation at checked-out source
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6712_rebased_apply.py

      - name: Patch-rot and authority scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/patch_rot_scan.py
          python3 ci/authority_contradiction_scan.py

      - name: Unit tests
        working-directory: lifecycle_apk
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug compile
        working-directory: lifecycle_apk
        run: ./gradlew --no-daemon assembleDebug

      - name: Commit repaired source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6712_patch_rot_consolidation.yml
          git add lifecycle_apk/app lifecycle_apk/ci lifecycle_apk/audits || true
          git diff --cached --check
          git commit -m "fix: V5.0.6712 consolidate runtime authority and causal learning"
          git push origin HEAD:main