# Production version is the committed root AATE_VERSION, never a staged repair title.
name: Build AATE APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifecycle_apk

    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve commit ancestry for diagnostic build provenance.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compute AATE build number
        id: aate_build
        run: |
          set -euo pipefail
          # Only the checked-in production version is authority. Commit titles
          # mentioning a staged repair must never relabel an unchanged APK.
          VERSION_NAME="$(tr -d '[:space:]' < ../AATE_VERSION)"
          if [[ ! "$VERSION_NAME" =~ ^5[.]0[.]([0-9]+)$ ]]; then
            echo "::error::Invalid production AATE_VERSION: $VERSION_NAME"
            exit 1
          fi
          BUILD_NUMBER="${BASH_REMATCH[1]}"
          echo "AATE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "AATE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Golden Tape literal static scan
        run: python3 ci/golden_tape_literal_scan.py

      - name: Authority contradiction source scan
        run: python3 ci/authority_contradiction_scan.py

      - name: Repository patch-rot scan
        run: python3 ci/patch_rot_scan.py

      - name: Build Release APK
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          GRADLE_CMD="./gradlew"
          for i in 1 2 3 4 5; do
            if ./gradlew --version --no-daemon; then
              GRADLE_CMD="./gradlew"
              break
            fi
            echo "Gradle wrapper bootstrap attempt $i failed; retrying in $((i*15))s..."
            sleep $((i*15))
          done
          if ! ./gradlew --version --no-daemon; then
            echo "Gradle wrapper unavailable; falling back to system gradle"
            GRADLE_CMD="gradle"
            gradle --version
          fi
          echo "========================================"
          echo "Building AATE v${{ steps.aate_build.outputs.version_name }}"
          echo "versionCode = $((500 + AATE_BUILD_NUMBER))"
          echo "========================================"
          $GRADLE_CMD testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME
          $GRADLE_CMD assembleRelease --no-daemon -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME
          python3 ci/build_gate_summary.py
          echo "Built APK:"
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: AATE_v${{ steps.aate_build.outputs.version_name }}
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aate-test-results-${{ github.sha }}
          path: |
            lifecycle_apk/app/build/test-results/
            lifecycle_apk/app/build/reports/tests/
          if-no-files-found: warn
