            --tests '*Aate8197*' \
            --tests '*GoldenTapeRegressionTest.V5_0_7281_floor_is_lamport_exact_recent_basis_accepted_and_ladder_skips_locked_rungs' \
            --no-daemon --stacktrace -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME

      # Keep required release checks strict while measuring every historical
      # test against the unchanged recorded 8089 baseline and rejecting regressions.
      - name: Complete historical suite and reject new failures
        run: |
          set +e
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME
          TEST_EXIT=$?
          set -e
          python3 ../ci/unit_regression_delta.py ../ci/baselines/8089-unit-results.json app/build/test-results/testReleaseUnitTest
          if [ "$TEST_EXIT" -ne 0 ] && ! find app/build/test-results/testReleaseUnitTest -name 'TEST-*.xml' -print -quit | read -r _; then
            echo "::error::Gradle failed without a complete test report"
            exit "$TEST_EXIT"
          fi

      # V5.0.7957 — name every failing test in the run's annotations (job logs and
      # artifacts are not readable from the build agent).
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for tc in root.iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.get('message') or (fl.text or '')[:400] or '').replace('\n', ' ').replace('%', '%25')[:700]
                      print(f"::error title=Test {tc.get('classname','').split('.')[-1]}.{tc.get('name')}::{msg}")
                      n += 1
                      if n >= 40:
                          raise SystemExit(0)
          print(f"annotated {n} failing tests")
          PY

      - name: Download previous published APK for an Android upgrade test
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous_apk release_art_evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?branch=main&status=success&per_page=1" > /tmp/previous-runs.json
          PREVIOUS_RUN=$(python3 -c 'import json; print(json.load(open("/tmp/previous-runs.json"))["workflow_runs"][0]["id"])')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN/artifacts" > release_art_evidence/previous_artifacts.json
          PREVIOUS_ARTIFACT=$(python3 -c 'import json; print(next(a["id"] for a in json.load(open("release_art_evidence/previous_artifacts.json"))["artifacts"] if a["name"].startswith("AATE_v") and not a["expired"]))')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PREVIOUS_ARTIFACT/zip" > /tmp/previous-apk.zip
          unzip -q /tmp/previous-apk.zip -d previous_apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 ci/release-art-startup.py lifecycle_apk/app/build/outputs/apk/release/AATE_v$(cat AATE_VERSION).apk --previous previous_apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-art-evidence-${{ github.sha }}
          path: release_art_evidence/
          if-no-files-found: warn

      # V5.0.8255 — the emulator runtime witness (runtime-test.yml) runs independently on every main push and its
      # verdict is read as evidence, not as the publisher's lock: a slow-emulator bootstrap stall must not leave the
      # operator without the compiled, regression-green APK to install. The unverified name below keeps a failed-test
      # build from ever being mistaken for green (owner request, 8094).

      # V5.0.7803 — a release APK is an acceptance artifact, not merely
      # compiler output. Publish it only after the required pipeline regressions
      # (including resident meme + Crypto architecture) are green.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AATE_v${{ steps.aate_build.outputs.version_name }}
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: failure() && steps.aate_build.outputs.version_name != ''
        with:
          name: AATE_v${{ steps.aate_build.outputs.version_name }}_UNVERIFIED_TESTS_FAILED
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk
          compression-level: 0
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aate-test-results-${{ github.sha }}
          path: |
            lifecycle_apk/app/build/test-results/
            lifecycle_apk/app/build/reports/tests/
          if-no-files-found: warn
