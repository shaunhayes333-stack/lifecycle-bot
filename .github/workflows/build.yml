# V5.0.6715 — verified production-source rebuild trigger; source authority remains the highest applied V5.0.xxxx commit.
name: Build AATE APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifecycle_apk

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required because the applied source version authority
          # is the highest V5.0.xxxx commit that actually landed on this branch.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compute AATE build number
        id: aate_build
        run: |
          RUN_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1))

          # Applied source authority: only a V5.0.xxxx commit counts as a release
          # version. A staged repair script does NOT count until its generated
          # production source has actually been committed.
          APPLIED_BUILD_NUMBER=$(git log --pretty=%s | grep -oE 'V5\.0\.[0-9]+' | sed -E 's/V5\.0\.//' | sort -n | tail -1 || true)
          if [ -z "$APPLIED_BUILD_NUMBER" ]; then APPLIED_BUILD_NUMBER=0; fi

          # Staged-repair detector. This prevents exactly the 6715 failure mode:
          # ci/v5_0_6715_*.py existed while app/src/main still contained 6714.
          STAGED_BUILD_NUMBER=$(find ci -maxdepth 1 -type f -name 'v5_0_[0-9]*_*.py' -printf '%f\n' \
            | sed -nE 's/^v5_0_([0-9]+)_.*/\1/p' | sort -n | tail -1 || true)
          if [ -z "$STAGED_BUILD_NUMBER" ]; then STAGED_BUILD_NUMBER=0; fi

          echo "Applied source version: $APPLIED_BUILD_NUMBER"
          echo "Highest staged repair: $STAGED_BUILD_NUMBER"

          if [ "$STAGED_BUILD_NUMBER" -gt "$APPLIED_BUILD_NUMBER" ]; then
            echo "::error::Staged AATE repair $STAGED_BUILD_NUMBER is newer than applied production source $APPLIED_BUILD_NUMBER. Refusing to publish a falsely-versioned APK."
            exit 1
          fi

          if [ "$APPLIED_BUILD_NUMBER" -gt 0 ]; then
            BUILD_NUMBER="$APPLIED_BUILD_NUMBER"
          else
            BUILD_NUMBER="$RUN_BUILD_NUMBER"
          fi

          BASE="$(cat AATE_VERSION)"
          VERSION_NAME="${BASE}.${BUILD_NUMBER}"
          echo "AATE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "AATE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Golden Tape literal static scan
        run: python3 ci/golden_tape_literal_scan.py

      - name: Authority contradiction source scan
        run: python3 ci/authority_contradiction_scan.py

      - name: Repository patch-rot scan
        run: python3 ci/patch_rot_scan.py

      - name: Build Release APK
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          GRADLE_CMD="./gradlew"
          for i in 1 2 3 4 5; do
            if ./gradlew --version --no-daemon; then
              GRADLE_CMD="./gradlew"
              break
            fi
            echo "Gradle wrapper bootstrap attempt $i failed; retrying in $((i*15))s..."
            sleep $((i*15))
          done
          if ! ./gradlew --version --no-daemon; then
            echo "Gradle wrapper unavailable; falling back to system gradle"
            GRADLE_CMD="gradle"
            gradle --version
          fi
          echo "========================================"
          echo "Building AATE v${{ steps.aate_build.outputs.version_name }}"
          echo "versionCode = $((500 + AATE_BUILD_NUMBER))"
          echo "========================================"
          $GRADLE_CMD testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME
          $GRADLE_CMD assembleRelease --no-daemon -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME
          python3 ci/build_gate_summary.py
          echo "Built APK:"
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: AATE_v${{ steps.aate_build.outputs.version_name }}
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v${{ steps.aate_build.outputs.version_name }}.apk
