# Production version is the committed root AATE_VERSION, never a staged repair title.
name: Build AATE APK

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Every revision is validated; only a validated main-branch build publishes an APK.
concurrency:
  group: aate-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifecycle_apk

    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve commit ancestry for diagnostic build provenance.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compute AATE build number
        id: aate_build
        run: |
          set -euo pipefail
          # V5.0.7453 — single production version authority.
          # Gradle's rootProject is lifecycle_apk, so lifecycle_apk/AATE_VERSION
          # is the exact file the APK build consumes. The repo-root mirror was a
          # second authority and blocked every 7446+ build before compilation.
          VERSION_NAME="$(tr -d '[:space:]' < AATE_VERSION)"
          if [[ ! "$VERSION_NAME" =~ ^5[.]0[.]([0-9]+)$ ]]; then
            echo "::error::Invalid production lifecycle_apk/AATE_VERSION: $VERSION_NAME"
            exit 1
          fi
          BUILD_NUMBER="${BASH_REMATCH[1]}"
          echo "AATE_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "AATE_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Accept SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # V5.0.6979 — runs before Gradle because it costs a second and the
      # failure it catches costs an 18-minute round trip. V5.0.6977 shipped
      # `ui/*.kt` inside a KDoc; Kotlin block comments nest, so that opened a
      # comment level the KDoc's own `*/` then closed, swallowing the rest of
      # the file and unresolving the object it declared 40 times over.
      - name: Kotlin nested block-comment balance
        run: python3 ci/comment_balance.py app/src

      - name: Golden Tape literal static scan
        run: python3 ci/golden_tape_literal_scan.py

      - name: Authority contradiction source scan
        run: python3 ci/authority_contradiction_scan.py

      - name: Repository patch-rot scan
        run: python3 ci/patch_rot_scan.py

      - name: Super Intelligence estate census
        run: |
          python3 ci/test_estate_reviewed_7686.py
          python3 ci/super_intelligence_estate_audit_7655.py

      - name: Economic unit / cash authority scan
        run: python3 ci/economic_units_scan.py

      - name: Android resource pre-flight
        run: python3 ci/res_validate.py

      - name: Layout id contract check
        run: python3 ci/layout_contract.py

      # V5.0.7015 — the app compiles and runs perfectly with two palettes, so
      # the only previous signal was the operator opening it and saying the
      # restyle did not land. That is an 18-minute build plus an install plus a
      # judgement call. This is a second.
      - name: Palette drift guard
        run: python3 ci/palette_drift.py

      # V5.0.7032 — five defects this session had one shape: the capability was
      # built correctly and the thing that needed it never called it (6994,
      # 6999, 6958, 7026, 7030). Two of them cost the operator days of a bot
      # that could not trade. This only inspects what the CURRENT change adds,
      # so it is never held hostage by the historical UNWIRED_LEDGER backlog,
      # and a green build means the new work is actually wired.
      # V5.0.7038 — three defects this session were the same mistake: grep a
      # NAME, act on it, never check what DECLARES it (7017 field owner, 7032
      # function owner, 7036 class-vs-object). The compiler catches all three;
      # this only saves the 18-minute cycle, which at three in a row is the
      # expensive part. Verified to catch both the fully-qualified and the
      # imported call form, and clean across a 70-file scan.
      - name: Static-call receiver guard
        run: |
          git fetch --deepen=2 --quiet || true
          python3 ci/test_static_call_check.py
          python3 ci/static_call_check.py HEAD~1

      # V5.0.7043 — third counter this session that reported a refusal which
      # did not happen (after 7027's eval and 7035's resetsOnFlip). Each one
      # sent someone at the wrong subsystem.
      - name: Return-telemetry honesty guard
        run: |
          git fetch --deepen=2 --quiet || true
          python3 ci/return_telemetry_check.py HEAD~1

      - name: New dead-code guard
        run: |
          git fetch --deepen=2 --quiet || true
          python3 ci/new_dead_code.py HEAD~1

      # V5.0.7078 — one wrong package segment
      # (com.lifecyclebot.engine.ConfigStore against a declaration in
      # com.lifecyclebot.data) failed builds 7075, 7076 and 7077 on the same
      # line: three builds and 54 minutes of CI, for a claim about where a
      # declaration lives that is checkable from source in under a second. It
      # sat inside a try/catch, which cannot catch a compile error and made the
      # line look guarded. Runs over the whole module rather than the diff —
      # 4281 references in ~1s — so a path that rots when a file MOVES is
      # caught too, not only one typed wrong today.
      - name: Qualified-reference package guard
        run: python3 ci/qualified_reference_check.py --all

      # V5.0.7113 — every guard above is a Python scan over Kotlin SOURCE; none
      # of them compile anything. A plain syntax error therefore passes all of
      # them and is only caught four minutes into Gradle. 7111 and 7112 were
      # both red on one such line. This catches that class in a second.
      - name: Kotlin expression-body return guard
        run: python3 ci/kotlin_expression_body_return.py

      # V5.0.7115 — lane names are compared for EQUALITY to match a sealed
      # execution authority to its requester. Thirteen hand-copies of the alias
      # table existed and they disagreed; one folded CASHGEN into TREASURY, which
      # cost every CASHGEN entry its sealed authority (1,251 events on the 7113
      # snapshot). CanonicalLaneIdentity6506 is the only authority now.
      - name: Lane identity authority guard
        run: python3 ci/lane_identity_authority_scan.py

      # V5.0.7216 — three consecutive red builds (7213, 7214, 7215) died on two
      # error classes a compiler sees instantly and no source scan was looking
      # for: a visibility modifier on a function pasted inside another
      # function's body, and assignment to a val property. The second came from
      # "verifying" mutability with a grep that matched the right FILE and the
      # wrong CLASS. Both guards are proven against the exact commits that
      # failed — they flag the same file:line the Kotlin compiler did.
      - name: Local-function modifier guard
        run: python3 ci/kotlin_local_function_modifiers.py

      - name: Val reassignment guard
        run: python3 ci/kotlin_val_assignment.py

      # V5.0.7720 — FinalDecisionGate.evaluate() is at the ART verifier's
      # limit; adding locals or a FinalDecision(...) block inside it has
      # crashed the app on login four times (7415, 7417, 7629, 7715). The
      # tests that guarded it ran in the diagnostic suite; this is required.
      - name: FinalDecisionGate.evaluate() verifier budget
        run: python3 ci/fdg_evaluate_budget_scan.py

      # V5.0.7809 — 5.0.7807 crashed on the PIN screen (VerifyError in
      # FinalDecisionGate.evaluate) after one declaration-free call was added;
      # the 7720 budget counts only declarations. Every oversized method is now
      # pinned to its 5.0.7808 (device-proven) code size and may only shrink.
      - name: Oversized method verifier budget
        run: python3 ci/oversized_method_budget_7809.py

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "========================================"
          echo "Building AATE v${{ steps.aate_build.outputs.version_name }}"
          echo "versionCode = $((500 + AATE_BUILD_NUMBER))"
          echo "========================================"
          # V5.0.7041 — REPEAT THE COMPILER ERRORS AT THE END OF THE LOG.
          #
          # Kotlin prints `e: file:...` right after compileReleaseKotlin and
          # then Gradle buries it under ~150 lines of its own stack trace. Every
          # programmatic log reader returns the TAIL, so the one line naming the
          # file and the error is exactly the line that never survives the trip.
          # 7036-7039 were four red builds where the compiler said precisely
          # what was wrong every time and it could not be read, and the fix was
          # reverted blind because of it.
          #
          # Echoing them last costs nothing and makes the next failure legible
          # in one look instead of a guess.
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=$AATE_BUILD_NUMBER -PaateVersionName=$AATE_VERSION_NAME 2>&1 | tee /tmp/gradle_build.log; then
            echo ""
            echo "################ KOTLIN COMPILE ERRORS (repeated for log tail) ################"
            grep -E "^e: |^error: " /tmp/gradle_build.log | head -40 || echo "(no 'e:' lines — failure was not a Kotlin compile error)"
            echo "################ END COMPILE ERRORS ################"
            # V5.0.7934 — also as check-run annotations: readable through the API
            # when the raw job log is not downloadable.
            grep -E "^e: |^error: " /tmp/gradle_build.log | head -20 | sed -E 's/[%]/%25/g' | while IFS= read -r line; do echo "::error title=Kotlin compile::${line:0:900}"; done || true
            grep -E "What went wrong|FAILURE:" -A3 /tmp/gradle_build.log | head -12 | while IFS= read -r line; do echo "::error title=Gradle::${line:0:500}"; done || true
            exit 1
          fi
          python3 ci/build_gate_summary.py
          echo "Built APK:"
          ls -la app/build/outputs/apk/release/

      - name: Required lane and history regression tests
        run: |
          ./gradlew testReleaseUnitTest \
            --tests '*Aate8397*' \
            --tests '*Aate8398*' \
            --tests '*Aate8372*' \
            --tests '*Aate8253*' \
            --tests '*Aate8136AdmissionRecordTest*' \
