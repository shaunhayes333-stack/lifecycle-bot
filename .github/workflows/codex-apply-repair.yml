name: Codex repair branch bootstrap
on:
  push:
    branches:
      - codex/repair-execution-spine-6647
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/codex-repair.patch
          git rm .github/workflows/codex-apply-repair.yml
          git apply --index /tmp/codex-repair.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V5.0.6648 repair execution spine and isolate trader books"
          git push origin HEAD:codex/repair-execution-spine-6647
