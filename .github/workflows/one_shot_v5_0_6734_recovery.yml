name: AATE Recovery Source Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_v5_0_6734_recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact tracked source for repair validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-export
          git rev-parse HEAD > recovery-export/commit.txt
          git archive --format=tar.gz HEAD > recovery-export/source.tar.gz
          sha256sum recovery-export/source.tar.gz > recovery-export/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aate-recovery-source-${{ github.sha }}
          path: recovery-export/
          retention-days: 3
          if-no-files-found: error

# This replaces an invalid self-modifying patch workflow.
# It does not apply staged replacements, disable safety gates, or push source.
# Production repairs are committed explicitly after source and regression review.
