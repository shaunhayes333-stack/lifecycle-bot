}
''')

          # Version + operator changelog.
          Path('AATE_VERSION').write_text('5.0.6734\n')
          changelog = Path('memory/CHANGELOG.md')
          existing = changelog.read_text()
          header = '''## V5.0.6734 — §INDEPENDENT_VETO_FAMILIES + §FDG_EVIDENCE_STABLE_CACHE + §DURABLE_REWARD_PARITY + §CURRENT_CANONICAL_LEDGER_AUTHORITY + §PAPER_RETRY_MARK_PARITY (PENDING CI)

6733 runtime diagnostic: FDG was passing heavily but fresh meme execution remained severely choked (`EXEC_GATE quorum=3` dominated blocks), FDG decisions/intake remained 6.44×, paper replay divergence continued blocking despite exact current equity conservation, retry tickets could still require a strict executable mark even though normal paper execution accepts observation marks, and the acceptance audit compared lifetime CLOSED/bus population against a session-local RewardPurity map.

- **§INDEPENDENT_VETO_FAMILIES** (`AdaptiveVetoConsensusAuthority6728`): correlated Brain/Unified/LLM/Sentience advisories now count as one MODEL family; streak/performance as OUTCOME; CapitalCreed as CAPITAL. Global hard veto requires all three independent families. Local lane/band suppressors and all hard safety gates remain intact.
- **§FDG_EVIDENCE_STABLE_CACHE** (`FinalDecisionGate` + `FdgReEvalThrottle`): removed volatile execution candidateVersion from decision-cache identity and extended bounded TTL to 20s. Signal, score band, safety tier/rug/hard-nos, liquidity and runtime generation still bust the cache. This targets same-mint re-decision fanout without reusing changed evidence.
- **§DURABLE_REWARD_PARITY** (`AcceptanceInvariantAudit6441`): population parity now uses persisted `CanonicalFinalizedTradeBus6464.consumerUnique(\"RewardPurity\")` ACK authority. Session W/L remains diagnostic only; no learning outcomes are replayed or double-applied.
- **§CURRENT_CANONICAL_LEDGER_AUTHORITY** (`PaperLedgerDivergenceGuard6731`): when current paper equity conservation and canonical↔registry position parity are both clean, historical replay drift is diagnostic-only and cannot hard-stop fresh entries. Any current canonical divergence keeps the original 6731 hard-stop thresholds.
- **§PAPER_RETRY_MARK_PARITY** (`ExecutableOpenGate`): expired/retry paper tickets may re-seal against a fresh authoritative observation mark, matching `Executor.paperBuy`; LIVE still requires a liquidity-bearing executable mark.
- **Probe semantics**: intentionally NOT amputated. Existing architecture defines `PROBE_ONLY` as an approved dust-size learning trade. 6734 fixes authority/choke contradictions rather than turning probes into another global no-buy path.
- **Regression**: updated `Aate6728AdaptiveConsensusTest`; added `Aate6734RecoveryAuthorityTest`; targeted 6533/6579/6616/6733 suites run before source is committed.

---

