          p.write_text(text.replace(old_clear, new_clear, 1))

          # New source-contract regression suite. These assertions deliberately
          # lock the contradictions that caused the 6733 runtime choke.
          recovery_test = TEST / 'Aate6734RecoveryAuthorityTest.kt'
          recovery_test.write_text(r'''package com.lifecyclebot.engine

import org.junit.Assert.*
import org.junit.Test
import java.io.File

class Aate6734RecoveryAuthorityTest {
    private fun src(path: String) = File("src/main/kotlin/com/lifecyclebot/$path").readText()

    @Test fun `fdg cache identity is evidence stable not candidate generation keyed`() {
        val s = src("engine/FinalDecisionGate.kt")
        assertTrue(s.contains("FDG_VERDICT_CACHE_TTL_MS = 20_000L"))
