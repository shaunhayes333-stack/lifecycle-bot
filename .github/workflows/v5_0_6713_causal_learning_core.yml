name: V5.0.6713 Causal Learning Core Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'apply 6713 causal learning core')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply causal learning source repair
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6713_causal_learning_core.py

      - name: Patch-rot and authority scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/patch_rot_scan.py
          python3 ci/authority_contradiction_scan.py

      - name: Full unit suite
        working-directory: lifecycle_apk
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compile production Kotlin
        working-directory: lifecycle_apk
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Commit only after all checks pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6713_causal_learning_core.yml
          git add lifecycle_apk/app/src/main/kotlin lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6713CausalLearningCoreTest.kt
          git diff --cached --check
          git commit -m "fix: restore canonical terminal to owner learner causality 6713"
          git push origin HEAD:main
