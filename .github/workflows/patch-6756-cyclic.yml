name: V5.0.6756 Cyclic Source Patch

on:
  push:
    branches:
      - fix/6756-pipeline-recovery

permissions:
  contents: write

jobs:
  patch-cyclic-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/6756-pipeline-recovery
          fetch-depth: 0

      - name: Patch CYCLIC FDG specialist ownership at source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/CyclicTradeEngine.kt')
          text = path.read_text()
          pattern = re.compile(
              r'^(?P<indent>\s*)tradingModeTag\s*=\s*try\s*\{\s*ModeSpecificGates\.fromTradingMode\("CYCLIC"\)\s*\}\s*catch\s*\(_:\s*Throwable\)\s*\{\s*null\s*\},\s*$',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one CYCLIC tradingModeTag in FDG path, found {len(matches)}')
          m = matches[0]
          indent = m.group('indent')
          insert = m.group(0) + '\n' + (
              indent + '// V5.0.6756 — TradingModeTag is diagnostic context, not specialist ownership.\n' +
              indent + '// Seal CYCLIC explicitly so FDG, immutable intent and executor agree.\n' +
              indent + 'specialistLane = "CYCLIC",'
          )
          text = text[:m.start()] + insert + text[m.end():]
          path.write_text(text)
          PY

          grep -n -A5 -B3 'specialistLane = "CYCLIC"' lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/CyclicTradeEngine.kt

      - name: Commit causal repair and remove one-shot patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/CyclicTradeEngine.kt
          git rm .github/workflows/patch-6756-cyclic.yml
          git commit -m 'V5.0.6756: seal CYCLIC as explicit FDG specialist owner'
          git push origin HEAD:fix/6756-pipeline-recovery
