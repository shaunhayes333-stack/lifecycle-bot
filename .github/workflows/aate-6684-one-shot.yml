name: AATE 6685 Integrated Adaptive and Wallet Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aate-6684-one-shot.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V5.0.6684 adaptive source repair
        shell: bash
        run: |
          set -euo pipefail
          python ci/aate_6684_adaptive_closed_loop_repair.py

          # Clean the stale 6305 tail completely. The source transform replaces
          # the old comment prefix, so also remove the orphaned suffix from that
          # original line before deleting the legacy recovery loop.
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt')
          s = p.read_text()
          s = re.sub(r'(?m)^\s*Operator directive 2026-07:\s*$', '', s)
          marker = '            // V5.0.6684 — PROOF-GATED RECOVERY ONLY. A paused lane cannot\n'
          a = s.find(marker)
          if a < 0:
              raise SystemExit('6684 proof-gated recovery marker missing')
          loop = s.find('            for ((lane, pauseState) in paused.toMap()) {', a)
          end = s.find('            if (mutated) persistAsync()', a)
          if loop >= 0 and end > loop:
              s = s[:loop] + '            // Legacy V5.0.6305 WR-only auto-recovery removed by 6684.\n' + s[end:]
          if 'LANE_AUTO_RECOVERED_6305' in s:
              raise SystemExit('stale LANE_AUTO_RECOVERED_6305 logic remains')
          if re.search(r'(?m)^\s*Operator directive 2026-07:\s*$', s):
              raise SystemExit('orphaned 6305 comment suffix remains')
          p.write_text(s)
          PY

      - name: Apply V5.0.6685 Helius wallet and stale-contract repair
        shell: bash
        run: |
          set -euo pipefail
          python ci/aate_6685_integrated_recovery.py

          # Staging/runner files must never survive the clean repair commit.
          rm -f ci/aate_6684_adaptive_closed_loop_repair.py
          rm -f ci/aate_6685_integrated_recovery.py
          rm -f .github/workflows/aate-6684-one-shot.yml

      - name: Integrated adaptive and provider static contracts
        shell: bash
        run: |
          set -euo pipefail
          cd lifecycle_apk

          # Adaptive closed loop.
          grep -q 'AdaptiveIntelligenceRuntime6684.start(applicationContext)' app/src/main/kotlin/com/lifecyclebot/AATEApp.kt
          grep -q 'LlmLabEngine.tick { buildUniverse() }' app/src/main/kotlin/com/lifecyclebot/engine/AdaptiveIntelligenceRuntime6684.kt
          grep -q 'AdaptiveLaneReproof6684.onLaneFailed(lane, reason)' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          grep -q 'CanonicalOutcomeClassifier6576.classifyReadonly' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          grep -q 'AdaptiveLaneReproof6684.sizeMultiplierForLane' app/src/main/kotlin/com/lifecyclebot/engine/truth/OrderSizeResolver6441.kt
          grep -q 'SsiPilotCouncil.sizeMultiplierForLane' app/src/main/kotlin/com/lifecyclebot/engine/truth/OrderSizeResolver6441.kt
          grep -q 'EXEC_OPEN_LAB_STRATEGY_WAIT_6684' app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          grep -q 'AdaptiveLaneReproof6684.exitStrategy(mode)' app/src/main/kotlin/com/lifecyclebot/engine/HoldingLogicLayer.kt
          grep -q 'SSI_PILOT_REPROOF_REQUEST_6684' app/src/main/kotlin/com/lifecyclebot/engine/SsiPilotCouncil.kt
          ! grep -q 'SSI_PILOT_LANE_RESUMED_6090' app/src/main/kotlin/com/lifecyclebot/engine/SsiPilotCouncil.kt
          ! grep -q 'LANE_AUTO_RECOVERED_6305' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          ! grep -q 'resumeBlacklist' app/src/main/kotlin/com/lifecyclebot/engine/LaneShadowProofLoop.kt
          ! grep -q 'maybeScanLabForAutoResume' app/src/main/kotlin/com/lifecyclebot/engine/LaneQuarantineController.kt

          # Runtime Helius / wallet authority.
          grep -q 'object RuntimeProviderAuthority6685' app/src/main/kotlin/com/lifecyclebot/engine/RuntimeProviderAuthority6685.kt
          grep -q 'cfg?.heliusApiKey' app/src/main/kotlin/com/lifecyclebot/engine/RuntimeProviderAuthority6685.kt
          grep -q 'RuntimeProviderAuthority6685.rpcCandidates(rpcUrl, ctx)' app/src/main/kotlin/com/lifecyclebot/engine/WalletManager.kt
          grep -q 'getSolBalancePrimaryOnly6685()' app/src/main/kotlin/com/lifecyclebot/engine/WalletManager.kt
          grep -q 'fun getSolBalancePrimaryOnly6685' app/src/main/kotlin/com/lifecyclebot/network/SolanaWallet.kt
          grep -q 'RuntimeProviderAuthority6685.configuredHeliusKey()' app/src/main/kotlin/com/lifecyclebot/network/SolanaWallet.kt
          grep -q 'RuntimeProviderAuthority6685.configuredHeliusRpc()' app/src/main/kotlin/com/lifecyclebot/network/JupiterApi.kt
          grep -q 'RuntimeProviderAuthority6685.preferredRpc' app/src/main/kotlin/com/lifecyclebot/engine/TreasuryWalletManager.kt
          ! grep -q 'DefaultKeys.HELIUS' app/src/main/kotlin/com/lifecyclebot/engine/WalletManager.kt
          ! grep -q 'DefaultKeys.HELIUS' app/src/main/kotlin/com/lifecyclebot/engine/TreasuryWalletManager.kt
          ! grep -q 'DefaultKeys.HELIUS' app/src/main/kotlin/com/lifecyclebot/network/JupiterApi.kt
          ! grep -q 'DefaultKeys.HELIUS' app/src/main/kotlin/com/lifecyclebot/network/SolanaWallet.kt
          ! grep -q 'api-key=hive-pattern-learn' app/src/main/kotlin/com/lifecyclebot/engine/WalletManager.kt

      - name: Repository contradiction and patch-rot scans
        shell: bash
        run: |
          set -euo pipefail
          cd lifecycle_apk
          python3 ../ci/golden_tape_literal_scan.py
          python3 ../ci/authority_contradiction_scan.py
          python3 ../ci/patch_rot_scan.py

      - name: Compile and run complete release unit suite
        shell: bash
        run: |
          set -euo pipefail
          cd lifecycle_apk
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6685 -PaateVersionName=5.0.6685

      - name: Commit clean V5.0.6685 integrated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AATE CI Repair'
          git config user.email 'aate-ci-repair@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No integrated repair changes to commit' >&2
            exit 1
          fi
          git commit -m 'V5.0.6685 integrate adaptive reproof and Helius wallet recovery'
          git push origin main

      - name: Dispatch canonical APK build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref main
