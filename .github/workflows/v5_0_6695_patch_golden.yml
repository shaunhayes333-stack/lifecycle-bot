name: V5.0.6695 Patch Golden Tape Contract

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'V5.0.6695 patch stale Golden Tape contract')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align Golden Tape with 6695 backlog authority
        run: |
          FILE="lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt"
          grep -q 'markEvaluationDisposition6567(observedTok6569' "$FILE"
          sed -i 's/markEvaluationDisposition6567(observedTok6569/markEvaluationProgress6570(observedTok6569/' "$FILE"
          grep -q 'markEvaluationProgress6570(observedTok6569' "$FILE"
          ! grep -q 'markEvaluationDisposition6567(observedTok6569' "$FILE"

      - name: Commit corrected contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt
          git rm -f .github/workflows/v5_0_6695_patch_golden.yml
          git rm -f .github/workflows/v5_0_6695_finalize_build.yml || true
          git diff --cached --check
          git commit -m "V5.0.6695 align Golden Tape with backlog defer authority"
          git push origin HEAD:main
