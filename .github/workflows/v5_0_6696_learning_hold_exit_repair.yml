name: V5.0.6696 Learning Hold Exit Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'V5.0.6696 run canonical learning hold exit repair')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Apply guarded learning and fluid hold-exit transforms
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6696_learning_hold_exit_repair.py

      - name: Source contradiction and patch-rot scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Run focused regression locks
        working-directory: lifecycle_apk
        run: |
          chmod +x gradlew || true
          ./gradlew :app:testDebugUnitTest --tests com.lifecyclebot.engine.Aate6696LearningHoldExitRepairTest --no-daemon --stacktrace

      - name: Commit repaired runtime source atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6696_learning_hold_exit_repair.yml
          git rm lifecycle_apk/ci/v5_0_6696_learning_hold_exit_repair.py
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/Executor.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/LearningEligibility.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/CanonicalFinalizedTradeBus6464.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/CanonicalTradeFinalizedBus6450.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/FinalizedBusConsumerBridge6465.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6696LearningHoldExitRepairTest.kt
          git add lifecycle_apk/audits/v5_0_6696_learning_hold_exit_repair.md
          git diff --cached --check
          git commit -m "V5.0.6696 repair canonical learning and fluid hold-exit loop"
          git push origin HEAD:main
