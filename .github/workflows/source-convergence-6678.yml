name: One-shot source convergence 6678

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-convergence-6678.yml'

permissions:
  contents: write

jobs:
  converge-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip-source-convergence-6678]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Converge CryptoAlt paper close onto canonical writer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('lifecycle_apk')
          crypto_path = root / 'app/src/main/kotlin/com/lifecyclebot/perps/CryptoAltTrader.kt'
          test_path = root / 'app/src/test/kotlin/com/lifecyclebot/engine/Aate6659CryptoRoundTripReconciliationTest.kt'
          guard_path = root / 'ci/patch_rot_scan.py'

          # ------------------------------------------------------------------
          # 1) Production source: canonical reducer owns PAPER close journal.
          # ------------------------------------------------------------------
          crypto = crypto_path.read_text()

          crypto, n_receipt = re.subn(
              r'\n\s*var canonicalCloseReceipt6659: com\.lifecyclebot\.engine\.truth\.CanonicalPaperTransaction6486\.Result\? = null\s*\n',
              '\n', crypto, count=1,
          )
          crypto, n_before = re.subn(
              r'\n\s*val canonicalBeforeClose6659 = if \(pos\.isPaper\) try \{.*?\n\s*\} catch \(_:\s*Throwable\) \{ null \} else null\s*\n',
              '\n', crypto, count=1, flags=re.S,
          )
          crypto, n_assign = re.subn(
              r'^\s*canonicalCloseReceipt6659 = canonicalClose6486\s*\n',
              '', crypto, count=1, flags=re.M,
          )
          if (n_receipt, n_before, n_assign) != (1, 1, 1):
              raise SystemExit(
                  f'6678 convergence: stale receipt structure mismatch receipt={n_receipt} before={n_before} assign={n_assign}'
              )

          marker = '// V5.0.6659 — the old CryptoAlt close discarded the canonical receipt'
          marker_at = crypto.find(marker)
          if marker_at < 0:
              raise SystemExit('6678 convergence: caller-side 6659 paper journal block not found')
          block_start = crypto.rfind('\n', 0, marker_at) + 1
          cleanup_at = crypto.find('        positions.remove(positionId)', marker_at)
          if cleanup_at < 0:
              raise SystemExit('6678 convergence: CryptoAlt local-cleanup boundary not found')
          replacement = '''        // V5.0.6678 — PAPER CLOSE JOURNAL AUTHORITY CONVERGENCE.
          // CanonicalPaperTransaction6486.close() performs terminal mutation and
          // durably projects that exact receipt into TradeHistoryStore before it
          // returns. CryptoAlt owns only local position cleanup after that boundary.
          // A second paper journal write here would be a contradictory patch stack.
          '''.replace('\n          ', '\n')
          crypto = crypto[:block_start] + replacement + crypto[cleanup_at:]

          close = crypto.split('private fun closePosition(positionId: String, reason: String)', 1)[-1]
          paper_prefix = close.split('positions.remove(positionId)', 1)[0]
          if 'CanonicalPaperTransaction6486.close(' not in paper_prefix:
              raise SystemExit('6678 convergence: canonical PAPER close owner missing')
          if 'TradeHistoryStore.recordTrade(' in paper_prefix:
              raise SystemExit('6678 convergence: caller-side PAPER journal writer survived')
          for retired in ('canonicalCloseReceipt6659', 'CRYPTO_ROUND_TRIP_JOURNAL_COMMITTED_6659'):
              if retired in crypto:
                  raise SystemExit(f'6678 convergence: retired CryptoAlt patch survived: {retired}')
          crypto_path.write_text(crypto)

          # ------------------------------------------------------------------
          # 2) Acceptance test: never positively require the retired writer.
          # Keep all unrelated 6659/6660 coverage intact.
          # ------------------------------------------------------------------
          test = test_path.read_text()
          third_start = test.index('    @Test\n    fun `paper close carries exact canonical receipt into journal before stop return`()')
          fourth_start = test.index('    @Test\n    fun `paper close has one terminal publisher and no legacy symbol keyed sell`()', third_start)
          fifth_start = test.index('    @Test\n    fun `typed crypto close bypasses only the Solana mint quarantine domain`()', fourth_start)

          third = r'''    @Test
          fun `paper close journal belongs only to canonical reducer before stop return`() {
              listOf(
                  "economicEventId = r.economicEventId",
                  "grossProceedsSol = r.grossProceedsSol",
                  "soldCostBasisSol = r.soldCostBasisSol",
                  "canonicalConsumedRaw = r.canonicalConsumedRaw",
                  "postRemainingRaw = r.postRemainingRaw",
              ).forEach { field -> assertTrue("canonical close result must preserve $field", transaction.contains(field)) }

              val reducerClose = transaction.substringAfter("fun close(positionId: String")
                  .substringBefore("fun refund(positionId: String")
              val terminalMutation = reducerClose.indexOf("CanonicalPaperTerminalBridge6469.finalizeSell(")
              val canonicalJournal = reducerClose.indexOf("recordCloseProjection6659(pos, r, exitReason, terminal)")
              val reducerReturn = reducerClose.indexOf("applied = true", canonicalJournal)
              assertTrue("canonical reducer must journal after terminal mutation", terminalMutation in 1 until canonicalJournal)
              assertTrue("canonical reducer must journal before returning to any trader", canonicalJournal in 1 until reducerReturn)
              assertTrue(reducerClose.contains("economicEventId = receipt.economicEventId"))
              assertTrue(reducerClose.contains("grossProceedsSol = gross"))

              val close = crypto.substringAfter("private fun closePosition(positionId: String, reason: String)")
              val localCleanup = close.indexOf("positions.remove(positionId)")
              val canonicalClose = close.indexOf("CanonicalPaperTransaction6486.close(")
              val fastStop = close.indexOf("if (reason == \"USER_STOP\"")
              assertTrue("canonical close must finish before local cleanup", canonicalClose in 1 until localCleanup)
              assertTrue("canonical close must finish before USER_STOP can return", canonicalClose in 1 until fastStop)
              val paperPrefix = close.substring(0, localCleanup)
              assertFalse("CryptoAlt caller must not write a second paper journal row", paperPrefix.contains("TradeHistoryStore.recordTrade("))
              assertFalse(crypto.contains("CRYPTO_ROUND_TRIP_JOURNAL_COMMITTED_6659"))
              assertFalse(crypto.contains("canonicalCloseReceipt6659"))
          }

          '''.replace('\n          ', '\n')

          fourth = r'''    @Test
          fun `paper close has one canonical terminal publisher and live journal stays live only`() {
              assertTrue(crypto.contains("if (!paper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit("))
              assertTrue(crypto.contains("if (!paper) try {\n            TradeHistoryStore.recordTrade(Trade("))
              val close = crypto.substringAfter("private fun closePosition(positionId: String, reason: String)")
              val paperPrefix = close.substringBefore("positions.remove(positionId)")
              assertTrue(paperPrefix.contains("CanonicalPaperTransaction6486.close("))
              assertFalse(paperPrefix.contains("TradeHistoryStore.recordTrade("))
          }

          '''.replace('\n          ', '\n')

          test = test[:third_start] + third + fourth + test[fifth_start:]
          test_path.write_text(test)

          # ------------------------------------------------------------------
          # 3) Repository ratchet: retired writer/marker may never return.
          # ------------------------------------------------------------------
          guard = guard_path.read_text()
          retired = '    "CRYPTO_ROUND_TRIP_JOURNAL_COMMITTED_6659": (\n        "CryptoAlt caller-side paper journal projection is retired; canonical reducer owns it"\n    ),\n'
          if '"CRYPTO_ROUND_TRIP_JOURNAL_COMMITTED_6659"' not in guard:
              dict_start = guard.index('RETIRED_PRODUCTION_SYMBOLS = {')
              dict_end = guard.index('\n}\n\n\ndef require', dict_start)
              guard = guard[:dict_end] + '\n' + retired + guard[dict_end:]

          contract = '''    crypto_alt = (SRC / "com/lifecyclebot/perps/CryptoAltTrader.kt").read_text()
              crypto_close = crypto_alt.split("private fun closePosition(positionId: String, reason: String)", 1)[-1]
              crypto_paper_prefix = crypto_close.split("positions.remove(positionId)", 1)[0]
              require(errors, crypto_paper_prefix, "CanonicalPaperTransaction6486.close(", "CRYPTO_PAPER_CLOSE_CANONICAL_OWNER_6678")
              forbid(errors, crypto_paper_prefix, "TradeHistoryStore.recordTrade(", "CRYPTO_PAPER_CLOSE_SINGLE_WRITER_6678")
              forbid(errors, crypto_alt, "canonicalCloseReceipt6659", "CRYPTO_PAPER_CLOSE_STALE_RECEIPT_PATCH_6678")

          '''.replace('\n              ', '\n')
          if 'CRYPTO_PAPER_CLOSE_CANONICAL_OWNER_6678' not in guard:
              insertion = guard.index('    # A prior Golden Tape assertion')
              guard = guard[:insertion] + contract + guard[insertion:]
          guard_path.write_text(guard)
          PY

      - name: Verify convergence guards locally
        working-directory: lifecycle_apk
        run: |
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Commit repaired source and remove one-shot migration
        shell: bash
        run: |
          git config user.name 'AATE Source Convergence'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/source-convergence-6678.yml
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/CryptoAltTrader.kt \
                  lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6659CryptoRoundTripReconciliationTest.kt \
                  lifecycle_apk/ci/patch_rot_scan.py
          git commit -m 'fix: converge CryptoAlt paper close onto canonical writer [skip-source-convergence-6678]'
          git push origin HEAD:main
