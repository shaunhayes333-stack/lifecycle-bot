name: One-shot V5.0.6805 causal integrity repair

on:
  push:
    branches:
      - repair/6805-causal-integrity
    paths:
      - ci/apply_6805_causal_integrity.py
      - ci/apply_6805_additional_authority_repairs.py
      - ci/apply_6805_build_contract_fixes.py
      - .github/workflows/one_shot_v5_0_6805_causal_integrity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/6805-causal-integrity
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply 6805 source repairs
        run: |
          python3 ci/apply_6805_causal_integrity.py
          python3 ci/apply_6805_additional_authority_repairs.py
          python3 ci/apply_6805_build_contract_fixes.py

      - name: Static regression gates
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Bootstrap Gradle
        working-directory: lifecycle_apk
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          curl -sL --retry 5 --retry-delay 10 -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          ./gradlew --version --no-daemon

      - name: Targeted 6805 and Golden Tape tests
        working-directory: lifecycle_apk
        run: |
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6805 -PaateVersionName=5.0.6805 \
            --tests com.lifecyclebot.engine.Aate6805CausalIntegrityRepairTest \
            --tests com.lifecyclebot.engine.Build6324InvariantsTest \
            --tests com.lifecyclebot.engine.Aate6735AcceptanceWitnessTest \
            --tests com.lifecyclebot.engine.ExecutionSpineAcceptance6647Test \
            --tests com.lifecyclebot.engine.GoldenTapeRegressionTest

      - name: Full release tests and APK compile
        working-directory: lifecycle_apk
        run: |
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6805 -PaateVersionName=5.0.6805
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=6805 -PaateVersionName=5.0.6805
          python3 ci/build_gate_summary.py
          test -f app/build/outputs/apk/release/AATE_v5.0.6805.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke on uncommitted tested repair
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CAPTURE_SECONDS: '180'
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: .
          script: bash ci/runtime-test.sh

      - name: Enforce runtime acceptance window
        run: |
          set -euo pipefail
          test -f logcat_full.txt
          ! grep -q 'EXECUTION_SPINE_ACCEPTANCE_6647_FAIL' logcat_full.txt
          grep -q 'EXECUTION_SPINE_ACCEPTANCE_6647_OK' logcat_full.txt

      - name: Commit and push only after all gates pass
        run: |
          git config user.name "aate-builder"
          git config user.email "aate@bot"
          git add AATE_VERSION lifecycle_apk/AATE_VERSION ci/runtime-test.sh \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/ExecutableEntryAuthority6450.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExitCoordinatorHeartbeat.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/LaneCapitalFairness6732.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/UnifiedAccountSnapshot6635.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/ExecutionSpineAcceptance6647.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/AcceptanceInvariantAudit6441.kt \
            lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/CausalFeedbackAuthority6715.kt \
            lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Build6324InvariantsTest.kt \
            lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6805CausalIntegrityRepairTest.kt \
            lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt
          git diff --cached --check
          git status --short
          git commit -m "V5.0.6805 repair causal authority and capital concentration"
          git push origin HEAD:repair/6805-causal-integrity

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AATE_v5.0.6805_verified
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v5.0.6805.apk
          if-no-files-found: error
