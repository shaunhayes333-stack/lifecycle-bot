name: AATE One-Shot Source Repair 6705

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'run one-shot specialist source authority repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source repair
        run: python3 lifecycle_apk/ci/source_repair_6705.py

      - name: Verify source contracts
        run: |
          python3 lifecycle_apk/ci/patch_rot_scan.py
          if grep -q 'setOf("V3_CORE", "STANDARD", "CASHGEN")' lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt; then
            echo 'CASHGEN shadow-disable residue remains' >&2
            exit 1
          fi

      - name: Commit repaired source to main
        run: |
          git config user.name 'shaunhayes333-stack'
          git config user.email 'shaunhayes333@gmail.com'
          git add -A
          git commit -m 'V5.0.6705 — restore CASHGEN executable specialist authority'
          git push origin HEAD:main
