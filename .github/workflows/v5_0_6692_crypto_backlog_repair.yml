name: V5.0.6692 Crypto Backlog Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'V5.0.6692 run Crypto Universe backlog repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded Crypto Universe repair
        run: python3 lifecycle_apk/ci/v5_0_6692_crypto_backlog_apply.py

      - name: Run source authority scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6692_crypto_backlog_repair.yml
          git rm lifecycle_apk/ci/v5_0_6692_crypto_backlog_apply.py
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/DynamicAltTokenRegistry.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/CryptoAltTrader.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6692CryptoBacklogRepairTest.kt
          git diff --cached --check
          git commit -m "V5.0.6692 repair Crypto Universe ownership backlog"
          git push origin HEAD:main
