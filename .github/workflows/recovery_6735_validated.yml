name: Validate AATE 6735 Source Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery_6735_validated.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aate-6735-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply exact reviewed source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/recovery6735/part{i}.b64').read_text() for i in (1, 2, 3))
          patches = [(encoded, 'c4c69d99201995d24b6b10e41c5222ea9331b7bfb874488b6edc6219af24559d', 'source'),
                     (Path('.github/recovery6735/overlay.b64').read_text(), '79887432f22d5630c1ab88ccf71137b1658c3ee0c86565e12189223828215a7a', 'overlay')]
          for encoded, expected, name in patches:
              patch = gzip.decompress(base64.b64decode(encoded, validate=True))
              if hashlib.sha256(patch).hexdigest() != expected:
                  raise SystemExit(f'{name} hash mismatch; refusing source mutation')
              Path(f'/tmp/aate6735-{name}.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/aate6735-source.patch
          git apply --index /tmp/aate6735-source.patch
          git apply --index --check /tmp/aate6735-overlay.patch
          git apply --index /tmp/aate6735-overlay.patch
          git rm lifecycle_apk/ci/v5_0_6734_recovery.py
          git rm .github/recovery6735/part1.b64 .github/recovery6735/part2.b64 .github/recovery6735/part3.b64 .github/recovery6735/overlay.b64 .github/workflows/recovery_6735_validated.yml
          git diff --cached --check
          git diff --cached --stat
      - name: Static authority regression checks
        working-directory: lifecycle_apk
        run: |
          set -euo pipefail
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py
      - name: Full production unit-test suite
        working-directory: lifecycle_apk
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p gradle/wrapper
          curl --fail --retry 3 -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6735 -PaateVersionName=5.0.6735 2>&1 | tee /tmp/aate6735-unit.log
      - name: Commit unit-tested source on review branch
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V5.0.6735 restore selective execution and canonical outcome integrity'
          SOURCE_SHA=$(git rev-parse HEAD)
          BRANCH="repair/6735-verified-${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$BRANCH"
          mkdir -p /tmp/aate6735-result
          printf '%s\n' "$SOURCE_SHA" > /tmp/aate6735-result/source-sha.txt
          printf '%s\n' "$BRANCH" > /tmp/aate6735-result/branch.txt
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Unit-tested source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Review branch: $BRANCH; main is not modified by this job." >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble exact tested source
        working-directory: lifecycle_apk
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=6735 -PaateVersionName=5.0.6735 2>&1 | tee /tmp/aate6735-build.log
          python3 ci/build_gate_summary.py
      - name: Preserve exact validation evidence
        if: always()
        run: |
          mkdir -p /tmp/aate6735-result
          git diff HEAD > /tmp/aate6735-result/uncommitted-source.patch
          cp /tmp/aate6735-*.log /tmp/aate6735-result/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aate-6735-validation-${{ github.run_id }}
          path: |
            /tmp/aate6735-result/
            lifecycle_apk/app/build/test-results/
            lifecycle_apk/app/build/reports/tests/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AATE_v5.0.6735_verified
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v5.0.6735.apk
          if-no-files-found: error
