name: AATE 6687 Runtime Truth Repair

on:
  push:
    branches: [ aate-6687-repair ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Rebase repair branch onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Apply V5.0.6687 source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci/aate_6687_repair.py')
          s = p.read_text()
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
          '''
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              if label == "Main open-position right-column width":
                  marker = "            // P&L (right column)\\n" + old
                  if marker in text:
                      return text.replace(marker, "            // P&L (right column)\\n" + new, 1)
              if old not in text:
          '''
          if old not in s:
              raise SystemExit('6687 workflow hotfix could not locate replace_once helper')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 ci/aate_6687_repair.py

      - name: Verify targeted repair contracts
        shell: bash
        run: |
          set -euo pipefail
          cd lifecycle_apk
          grep -q 'LIVE_FINAL_EXECUTABLE_FLOOR_RESTORED_6687' app/src/main/kotlin/com/lifecyclebot/engine/Executor.kt
          grep -q 'txEconomicsMatch6687' app/src/main/kotlin/com/lifecyclebot/engine/truth/EntryPriceIntegrityAuthority6405.kt
          grep -q 'LANE_HARD_SEED_PATCH_ROT_PURGED_6687' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          ! grep -q 'Triple("QUALITY", "hard_seed_' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          ! grep -q 'Triple("BLUECHIP", "hard_seed_' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          ! grep -q 'Triple("EXPRESS", "hard_seed_' app/src/main/kotlin/com/lifecyclebot/engine/LaneAutoPauseGuard.kt
          ! grep -q 'val treasuryFloor = TreasuryManager.treasurySol' app/src/main/kotlin/com/lifecyclebot/engine/SmartSizer.kt
          grep -q 'effectiveLockedSol(walletSol, c.paperMode)' app/src/main/kotlin/com/lifecyclebot/engine/SecurityGuard.kt
          grep -q 'effectiveLockedSol(liveWalletForTreasury6687, isPaperMode = false)' app/src/main/kotlin/com/lifecyclebot/ui/MainActivity.kt
          ! grep -q 'LIVE LIVE[$]laneChip' app/src/main/kotlin/com/lifecyclebot/ui/MainActivity.kt
          grep -q '132f \* resources.displayMetrics.density' app/src/main/kotlin/com/lifecyclebot/ui/MainActivity.kt

      - name: Repository contradiction and patch-rot scans
        shell: bash
        run: |
          set -euo pipefail
          cd lifecycle_apk
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Compile and run release unit suite
        shell: bash
        run: |
          set -euo pipefail
          cd lifecycle_apk
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6687 -PaateVersionName=5.0.6687

      - name: Commit repaired production source and push main
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/aate_6687_repair.py
          rm -f .github/workflows/aate-6687-source-repair.yml
          git config user.name 'AATE CI Repair'
          git config user.email 'aate-ci-repair@users.noreply.github.com'
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo 'No 6687 source changes to commit' >&2
            exit 1
          fi
          git commit -m 'V5.0.6687 repair live execution floor, treasury authority, lane patch rot and open-position UI'
          git push origin HEAD:main
