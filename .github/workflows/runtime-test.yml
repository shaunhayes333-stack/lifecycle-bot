name: Runtime Smoke Test

# V5.9.657 — operator request: stop relying on "build → operator installs →
# operator captures logcat → operator pastes here" 4-hour cycles. This
# workflow boots an Android emulator on the runner, installs the freshly
# built APK, opens MainActivity, captures Logcat for 3 minutes, and uploads
# the full + filtered logs as artifacts. Lets the agent see real on-device
# behavior without needing physical hardware.
#
# Triggers:
#   - workflow_dispatch    (manual run from the Actions tab)
#   - completion of "Build AATE APK"  (auto-runs after every green build)
#
# Cost: ~10-15 min wall clock. Free on public repos.

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      capture_seconds:
        description: 'Logcat capture duration (seconds)'
        required: false
        default: '180'
  workflow_run:
    workflows: ["Build AATE APK"]
    types: [completed]

permissions:
  contents: read

# V5.0.6887 — one smoke verdict per commit.
# Commit e1e3191 (V5.0.6881) produced ONE "Build AATE APK" run and NINE
# workflow_run-triggered smoke runs, all started within 15 minutes of each
# other and all reaching the emulator. At up to 35 minutes of emulator time
# each that is ~5 hours of runner time per push, and because Actions
# serializes the queue it is also why every verification round trip in this
# repo has been taking 13-16 minutes: the queue was full of duplicates of
# itself. The trigger is already minimal (one workflows entry, one type), so
# the duplication is in event delivery, not in the condition — a concurrency
# group is the fix that holds regardless of how many times the event arrives.
# Keyed on the built commit so pushes still get independent verdicts, and
# superseded duplicates report `cancelled`, never `failure`, so a cancelled
# duplicate can never be mistaken for a real red.
concurrency:
  group: runtime-smoke-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Don't run when the upstream build failed.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 35

    defaults:
      run:
        working-directory: lifecycle_apk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # V5.0.6854 — this input is NOT optional any more. The action's default
          # is `packages: 'tools platform-tools'`, and Google has withdrawn the
          # legacy `tools` package from the SDK repository, so sdkmanager now exits
          # 1 with "Warning: Failed to find package 'tools'". That killed this job
          # ~15s in, before KVM/AVD/emulator ever ran, and the `if: always()`
          # witness step then failed on the missing logcat_full.txt — which is what
          # the red "Runtime Smoke Test" runs have actually been reporting, not a
          # runtime regression in the app. build.yml already pins its packages,
          # which is why it stayed green while this workflow went red.
          packages: 'platform-tools'

      - name: Enable KVM (hardware accel for emulator)
        # Without KVM the emulator runs in software and times out on most
        # GitHub runners. KVM is available on ubuntu-latest since 2023.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-x86_64-googleapis

      - name: Create AVD snapshot for cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Build, install, run, capture logcat
        env:
          CAPTURE_SECONDS: ${{ github.event.inputs.capture_seconds || '180' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: .
          script: bash ci/runtime-test.sh

      - name: Enforce current 120-second execution-spine witness
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ci -p test_runtime_evidence.py
          python3 ci/runtime_evidence.py "$GITHUB_WORKSPACE/logcat_full.txt" \
            --output "$GITHUB_WORKSPACE/runtime_evidence.json" \
            --summary "$GITHUB_WORKSPACE/funnel_summary.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-logcat-${{ github.run_number }}
          path: |
            logcat_full.txt
            logcat_filtered.txt
            funnel_summary.txt
            ui_dump.xml
            ui_*.xml
            activity_dump.txt
            ui_first_cycle_logcat.txt
            logcat_second_start.txt
            runtime_evidence.json
