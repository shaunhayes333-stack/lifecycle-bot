name: V5.0.6710 WR Collapse + Reward Purity Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'run WR collapse purity repair')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Apply source-level WR and reward-purity repair
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6710_wr_purity_repair.py

      - name: Source contradiction and patch-rot scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Run focused regression lock
        working-directory: lifecycle_apk
        run: |
          chmod +x gradlew || true
          ./gradlew :app:testDebugUnitTest \
            --tests com.lifecyclebot.engine.Aate6710WinrateRegressionLockTest \
            --no-daemon --stacktrace

      - name: Commit repaired canonical source atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6710_wr_purity_repair.yml
          git rm lifecycle_apk/ci/v5_0_6710_wr_purity_repair.py
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/Executor.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/FinalDecisionGate.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/PaperLearningEligibility6519.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/RewardPurityGate6441.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6710WinrateRegressionLockTest.kt
          git diff --cached --check
          git commit -m "V5.0.6710 — restore collapse selectivity and canonical reward purity"
          git push origin HEAD:main
