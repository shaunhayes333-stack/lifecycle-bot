name: V5.0.6709 Exit Authority Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'run 6709 exit authority repair')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Apply 6709 canonical exit authority repair
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6709_exit_authority_repair.py

      - name: Source contradiction and patch-rot scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Run 6709 focused regression locks
        working-directory: lifecycle_apk
        run: |
          chmod +x gradlew || true
          ./gradlew :app:testDebugUnitTest \
            --tests com.lifecyclebot.engine.Aate6709AdaptiveTurnoverCycleTest \
            --tests com.lifecyclebot.engine.Aate6709ProtectiveExitAuthorityTest \
            --no-daemon --stacktrace

      - name: Commit repaired source atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6709_exit_authority_repair.yml
          git rm lifecycle_apk/ci/v5_0_6709_exit_authority_repair.py
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/AutoModeEngine.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/Executor.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6709ProtectiveExitAuthorityTest.kt
          git diff --cached --check
          git commit -m "V5.0.6709 — restore canonical protective exit stop authority"
          git push origin HEAD:main
