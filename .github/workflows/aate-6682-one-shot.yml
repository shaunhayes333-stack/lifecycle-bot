name: AATE 6682 one-shot Golden Tape repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/aate-6682-one-shot.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale UnifiedPolicyHead Golden Tape contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt')
          text = path.read_text()
          marker = '    @Test\n    fun unifiedPolicyHead_4470StoresPendingSignalsPerMintAndLane() {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('stale 4470 UnifiedPolicyHead Golden Tape test marker not found')
          next_test = text.find('\n    @Test\n', start + len(marker))
          if next_test < 0:
              raise SystemExit('next Golden Tape test marker not found')
          new_lines = [
              '    @Test',
              '    fun unifiedPolicyHead_6682BindsOwnerSnapshotAndTrainsSingleCausalLane() {',
              '        val src = java.io.File("src/main/kotlin/com/lifecyclebot/engine/UnifiedPolicyHead.kt").readText()',
              '        assertTrue(',
              '            "V5.0.6682: pre-open observations may remain keyed by mint and lane until canonical owner election",',
              '            src.contains("ConcurrentHashMap<String, java.util.concurrent.ConcurrentHashMap<String, DoubleArray>>") &&',
              '                src.contains("pending.computeIfAbsent(mint)"),',
              '        )',
              '        assertTrue(',
              '            "V5.0.6682: canonical open must freeze one immutable owner-bound entry snapshot",',
              '            src.contains("fun bindPosition6681(positionId: String, mint: String, ownerLane: String): Boolean") &&',
              '                src.contains("pendingByPosition6681[positionId] = BoundEntry6681(mint, owner, selected)"),',
              '        )',
              '        assertTrue(',
              '            "V5.0.6682: terminal finality must train exactly one global update and the actual owner lane only",',
              '            src.contains("fun recordOutcome6681(positionId: String, mint: String, ownerLane: String, pnlPct: Double): Boolean") &&',
              '                src.contains("trainOneOutcome6681(owner, bound.features, pnlPct)") &&',
              '                src.contains("Exactly ONE global update per terminal canonical position") &&',
              '                src.contains("Exactly ONE owner-lane update"),',
              '        )',
              '        assertTrue(',
              '            "V5.0.6682: legacy settled-outcome multi-lane fanout must stay removed",',
              '            !src.contains("for ((lane, x) in recs)") &&',
              '                !src.contains("UNIFIED_POLICY_HEAD_ALL_LANE_OUTCOME_4470"),',
              '        )',
              '    }',
              '',
          ]
          replacement = '\n'.join(new_lines)
          updated = text[:start] + replacement + text[next_test:]
          if updated.count('unifiedPolicyHead_6682BindsOwnerSnapshotAndTrainsSingleCausalLane') != 1:
              raise SystemExit('6682 replacement test count is not exactly one')
          if 'settled outcome must train every stamped lane head' in updated:
              raise SystemExit('stale multi-lane settled-outcome assertion remains')
          path.write_text(updated)
          print('Replaced stale 4470 multi-lane outcome contract with 6682 causal owner-bound contract')
          PY

          grep -Fq 'unifiedPolicyHead_6682BindsOwnerSnapshotAndTrainsSingleCausalLane' lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt
          ! grep -Fq 'settled outcome must train every stamped lane head' lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt

      - name: Commit repair and remove one-shot helper
        shell: bash
        run: |
          rm .github/workflows/aate-6682-one-shot.yml
          git config user.name 'AATE CI Repair'
          git config user.email 'aate-ci-repair@users.noreply.github.com'
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt .github/workflows/aate-6682-one-shot.yml
          git diff --cached --check
          git commit -m 'V5.0.6682 fix stale UnifiedPolicyHead Golden Tape contract'
          git push origin HEAD:main

      - name: Dispatch canonical build on repaired main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" -f ref=main
          echo 'Canonical build dispatched for repaired main.'
