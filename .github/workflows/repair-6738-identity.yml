name: Repair identity source commit
on:
  push:
    branches: ['repair/6737-exit-accounting']
permissions:
  contents: write
concurrency:
  group: repair-6738-identity
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/repair/6737-exit-accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and verify exact follow-up source diff
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 4a5b00530b1434b6f5442af9c16369e139649e75 HEAD
          python3 - <<'PY'
          import os, base64, lzma, hashlib, pathlib
          patch = lzma.decompress(base64.b64decode(os.environ['PATCH_B64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'ebea7974019b17ee832dfd4012d998971c6d48d1c5ae1e1f8dc0135fb5b7a5f4'
          assert len(patch) == 20117
          pathlib.Path(os.environ['RUNNER_TEMP'], 'identity.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/identity.patch"
          git apply "$RUNNER_TEMP/identity.patch"
          git diff --check
          cd lifecycle_apk
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py
      - name: Commit the actual source and six additional regression tests
        run: |
          set -euo pipefail
          git fetch origin repair/6737-exit-accounting
          test "$(git rev-parse origin/repair/6737-exit-accounting)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/PaperPositionCloseAuthority.kt lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/CanonicalPositionAuthority6441.kt lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6738ExitRecoveryTest.kt
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'fix: preserve exact exit identity and atomic retry-to-terminal state transitions' -m 'Reject unknown explicit IDs and wrong mint/mode/class without mutating another position or closed history. Make paper retry recovery share the per-key write lock with terminal updates. Add six regression tests; full Android validation required.'
          git push origin HEAD:repair/6737-exit-accounting
          git rev-parse HEAD
