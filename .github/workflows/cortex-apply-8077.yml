          Verification: eight local numeric groups passed on production Cortex classes with compile-only JSON/Android boundaries; comment, authority and economic-unit scans passed. Aate8077StrategyAlignmentTest is required in CI. Full Android compile, blocking regressions and runtime smoke must pass on the final source before production acceptance.

          Not asserted closed: original OOM allocator, provider entitlements/quotas, device-specific stop/finality latency, exact-mint quantity/orphan reconciliation and all missing causal predecessors. A raw confirmed OPEN with a zero validated funnel is an instrumentation discrepancy, not proof no trade occurred.
          ''')
          print('All exact source assertions passed; reviewed strategy changes applied.')
      - name: Source checks and prepare commit object
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import subprocess, pathlib, json, os, base64, urllib.request, tarfile
          def git(*args):
              return subprocess.check_output(['git',*args],text=True).strip()
          for scan in ('comment_balance.py','authority_contradiction_scan.py','economic_units_scan.py'):
              subprocess.run(['python3','ci/'+scan],cwd='lifecycle_apk',check=True)
          subprocess.run(['git','diff','--check'],check=True)
          parent=git('rev-parse','HEAD')
          changed=git('diff','--name-only').splitlines()
          changed += ['lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/cortex/LaneEvidence8077.kt','lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate8077StrategyAlignmentTest.kt','lifecycle_apk/audits/cortex_8077_alignment.md']
          for p in ('.github/workflows/cortex-source-review-8077.yml','.github/workflows/cortex-apply-8077.yml'):
              if pathlib.Path(p).exists():
                  subprocess.run(['git','rm',p],check=True)
          subprocess.run(['git','add','--',*changed],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def post(path,data):
              req=urllib.request.Request(api+path,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)
          paths=git('diff','--cached','--name-only').splitlines()
          tree=[]
          for name in paths:
              p=pathlib.Path(name)
              if not p.exists():
                  tree.append({'path':name,'mode':'100644','type':'blob','sha':None})
              else:
                  blob=post('/git/blobs',{'content':base64.b64encode(p.read_bytes()).decode(),'encoding':'base64'})
                  tree.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          t=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':tree})
          c=post('/git/commits',{'message':'fix: align lane tactics, proven setup selection and mode-isolated Cortex authority','tree':t['sha'],'parents':[parent]})
          out=pathlib.Path('/tmp/cortex-reviewed-8077'); out.mkdir()
          manifest={'parent_sha':parent,'commit_sha':c['sha'],'tree_sha':t['sha'],'changed_files':paths,'source_checks':'passed','branch_updated':False}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          with tarfile.open(out/'reviewed-source.tar.gz','w:gz') as tar:
              for root in ('lifecycle_apk','ci','.github','AATE_VERSION'):
                  tar.add(root,arcname=root)
          print(json.dumps(manifest,indent=2))
          # Deliberately no ref update: connector CAS publishes this exact object and triggers normal PR CI.
      - uses: actions/upload-artifact@v4
        with:
          name: aate-reviewed-source-8077
          path: /tmp/cortex-reviewed-8077/
          retention-days: 2
