          p=K/'engine/cortex/CortexScoreboard7885.kt'
          change(p,'baseline, PROOF_MARGIN_PCT, MIN_N_LIVE, overruleProven(strong))',
              '''baseline, PROOF_MARGIN_PCT, MIN_N_LIVE,
                          overruleProven(strong) && strong.mean() - se(strong) > baseline + PROOF_MARGIN_PCT)''')
          change(p,'''            if (fullProven) return 1.0
                      if (!(n >= GRAD_MIN_N_7955) || !mean.isFinite()) return 0.0''',
              '''            if (!(n >= GRAD_MIN_N_7955) || !n.isFinite() || !mean.isFinite() || !baselinePct.isFinite() ||
                          !marginPct.isFinite() || !se.isFinite() || se < 0.0) return 0.0
                      if (fullProven) return 1.0''')
          change(p,'fun inverted7948(lane: String): Boolean {','fun inverted7948(lane: String, mode: String = "LIVE"): Boolean {')
          change(p,'''        for (mode in listOf("LIVE", "PAPER")) {
                      val r = realized["$mode|$lane"] ?: continue
                      if (inverted(r)) return true
                  }''',
              '''        // Paper execution outcomes must not suspend LIVE authority, or vice versa.
                  realized["${mode.uppercase()}|$lane"]?.let { if (inverted(it)) return true }''')
          change(p,'fun fractionFor7955(lane: String): Double {','fun fractionFor7955(lane: String, mode: String = "LIVE"): Double {')
          change(p,'return matureAuthority8025(evidenceFor8025(lane), b.strongLifetime8025)','return matureAuthority8025(evidenceFor8025(lane, mode), b.strongLifetime8025)')
          change(p,'fun evidenceFor8025(lane: String): Double {','fun evidenceFor8025(lane: String, mode: String = "LIVE"): Double {')
          change(p,'b.byBucket[Bucket.NEUTRAL.ordinal], inverted7948(lane))','b.byBucket[Bucket.NEUTRAL.ordinal], inverted7948(lane, mode))')
          p=K/'engine/cortex/Cortex7885.kt'
          s=p.read_text()
          for before,after in [
              ('board.inverted7948(canon(laneRaw))','board.inverted7948(canon(laneRaw), accountMode8077())'),
              ('board.inverted7948(a.lane)','board.inverted7948(a.lane, accountMode8077())'),
              ('board.inverted7948(lane)','board.inverted7948(lane, accountMode8077())'),
              ('board.evidenceFor8025(a.lane)','board.evidenceFor8025(a.lane, accountMode8077())'),
              ('board.fractionFor7955(lane)','board.fractionFor7955(lane, accountMode8077())')]:
              assert before in s, before
              s=s.replace(before,after)
          anchor='    private fun credits7888(): Double'
          assert s.count(anchor)==1
          s=s.replace(anchor,'    private fun accountMode8077(): String = if (com.lifecyclebot.engine.RuntimeModeAuthority.isPaper()) "PAPER" else "LIVE"\n\n'+anchor)
          p.write_text(s)
          p=K/'engine/cortex/CortexLedger7885.kt'
          change(p,'fun brierSkill(): Double = if (scored >= MIN_SCORED && brierBase > 0.0) 1.0 - brierModel / brierBase else 0.0','fun brierSkill(): Double = LaneEvidence8077.skill(scored, brierModel, brierBase)')
          change(p,'fun logLossSkill(): Double = if (scored >= MIN_SCORED && logLossBase > 0.0) 1.0 - logLossModel / logLossBase else 0.0','fun logLossSkill(): Double = LaneEvidence8077.skill(scored, logLossModel, logLossBase)')
          change(p,'''        fun add(y: Double, runner: Boolean): Double {
                      val stamp = logScale''',
              '''        fun add(y: Double, runner: Boolean): Double {
                      if (!y.isFinite() || !(y * y).isFinite()) return Double.NaN
                      val stamp = logScale''')
          p=R/'.github/workflows/build.yml'
          change(p,'\njobs:\n','\nconcurrency:\n  group: aate-build-${{ github.event.pull_request.head.ref || github.ref_name }}\n  cancel-in-progress: true\n\njobs:\n')
          change(p,"            --tests '*Aate8076*' \\","            --tests '*Aate8076*' \\\n            --tests '*Aate8077*' \\")
          p=R/'.github/workflows/runtime-test.yml'
          change(p,'group: runtime-smoke-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}',
              'group: runtime-smoke-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.ref_name }}')
          for path in [R/'AATE_VERSION',R/'lifecycle_apk/AATE_VERSION']:
              assert path.read_text().strip() in ('5.0.8076','5.0.8077'), 'Concurrent version changed'
              path.write_text('5.0.8077\n')
          p=T/'Aate8034MoonbagAndFirstSightTest.kt'
          change(p,'!board.inverted7948(a.lane)) board.evidenceFor8025(a.lane) else -1.0','!board.inverted7948(a.lane, accountMode8077())) board.evidenceFor8025(a.lane, accountMode8077()) else -1.0')
          p=T/'Bundle6374InvariantsTest.kt'
          s=p.read_text().replace('tradesIn >= AGG_BAD_BAND_MIN_SAMPLES && lossRate > AGG_BAD_BAND_MIN_LOSS_RATE','lowWinRateNeedsPivot(tradesIn, lossRate, meanPnl)')
          s=s.replace('val aggBadBand = totalSamples >= AGG_BAD_BAND_MIN_SAMPLES && lossRate > AGG_BAD_BAND_MIN_LOSS_RATE','lowWinRateNeedsPivot(totalSamples, lossRate, st.meanPnl)')
          s=s.replace('fun tacticSwitcher_agg_bad_band_rotates_50trade_bleeder()', 'fun tacticSwitcher_retains_profitable_asymmetric_50trade_strategy()')
          old='''        assertNotEquals(
                      "V5.0.6374: a 15W/45L bleeder (WR=25%, μ=+71%) MUST NOT sit on the initial MOMENTUM tactic — agg-bad-band gate is required to force rotation",'''
          new='''        assertEquals(
                      "8077: low WR alone must not rotate a positive-net-expectancy strategy",'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          test='''package com.lifecyclebot.engine

          import com.lifecyclebot.engine.cortex.CortexLedger7885
          import com.lifecyclebot.engine.cortex.CortexScoreboard7885
          import com.lifecyclebot.engine.cortex.CortexScoreboard7885.Bucket
