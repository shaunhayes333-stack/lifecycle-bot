name: One-shot source convergence 6679

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-convergence-6679.yml'

permissions:
  contents: write

jobs:
  converge-outcomes:
    if: ${{ !contains(github.event.head_commit.message, '[skip-source-convergence-6679]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Converge paper outcome publishers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('lifecycle_apk')
          perps_path = root / 'app/src/main/kotlin/com/lifecyclebot/perps/PerpsTraderAI.kt'
          stock_path = root / 'app/src/main/kotlin/com/lifecyclebot/perps/TokenizedStockTrader.kt'
          guard_path = root / 'ci/patch_rot_scan.py'

          perps = perps_path.read_text()

          # PAPER terminal outcome must be owned by CanonicalPaperTransaction6486.
          publish_marker = '        // V5.0.6564 — Perps local learning is not sufficient:'
          publish_start = perps.index(publish_marker)
          publish_end = perps.index('        // Add to recent trades', publish_start)
          publish_block = perps[publish_start:publish_end]
          publish_call = '        com.lifecyclebot.engine.CanonicalPublishHelper.publishExit('
          publish_count = publish_block.count(publish_call)
          if publish_count != 1:
              raise SystemExit(f'6679: expected one Perps explicit outcome publisher, found {publish_count}')
          publish_block = publish_block.replace(
              publish_call,
              '        if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(',
              1,
          )
          perps = perps[:publish_start] + publish_block + perps[publish_end:]

          # Retire the caller-side PAPER journal row but preserve the LIVE receipt.
          journal_marker = '        // V5.9.248: Wire perps trades into shared journal (live + paper tabs)'
          journal_start = perps.index(journal_marker)
          journal_end = perps.index('\n        save()', journal_start)
          journal_block = perps[journal_start:journal_end]
          direct_writer_count = journal_block.count('TradeHistoryStore.recordTrade(Trade(')
          if direct_writer_count != 1:
              raise SystemExit(f'6679: expected one legacy Perps direct journal writer, found {direct_writer_count}')
          if 'val modeStr248 = if (position.isPaper) "paper" else "live"' not in journal_block:
              raise SystemExit('6679: expected mutable Perps journal mode selector not found')
          if 'mode             = modeStr248,' not in journal_block:
              raise SystemExit('6679: expected mutable Perps journal mode assignment not found')
          if '\n        try {\n' not in journal_block:
              raise SystemExit('6679: expected Perps journal try boundary not found')

          journal_block = journal_block.replace(
              journal_marker,
              '        // V5.0.6679 — PAPER is already journaled by CanonicalPaperTransaction6486.close.\n'
              '        // Keep this presentation receipt LIVE-only so PAPER cannot create a second\n'
              '        // unkeyed SELL or a second CanonicalOutcomeBus terminal event.',
              1,
          )
          journal_block = journal_block.replace('\n        try {\n', '\n        if (!position.isPaper) try {\n', 1)
          journal_block = ''.join(
              line for line in journal_block.splitlines(keepends=True)
              if 'val modeStr248 = if (position.isPaper)' not in line
          )
          journal_block = journal_block.replace('mode             = modeStr248,', 'mode             = "live",', 1)
          perps = perps[:journal_start] + journal_block + perps[journal_end:]

          # The close path currently records the same PAPER FluidLearning SELL twice.
          # Keep the synchronous call; delete only the duplicate async replay fanout.
          fluid_marker = '                // V5.9.8: Sync to FluidLearning shared pool'
          fluid_start = perps.index(fluid_marker)
          fluid_end = perps.index('                ErrorLogger.debug(TAG, "🎬 Trade recorded for learning:', fluid_start)
          fluid_block = perps[fluid_start:fluid_end]
          duplicate_fluid_count = fluid_block.count('FluidLearning.recordPaperSell(')
          if duplicate_fluid_count != 1:
              raise SystemExit(f'6679: expected one duplicate async FluidLearning SELL, found {duplicate_fluid_count}')
          perps = (
              perps[:fluid_start]
              + '                // V5.0.6679: PAPER FluidLearning SELL is recorded once on the synchronous close path.\n'
              + perps[fluid_end:]
          )

          close = perps.split('fun closePosition(positionId: String, exitPrice: Double, exitReason: PerpsExitSignal)', 1)[-1]
          if 'CanonicalPaperTransaction6486.close(' not in close:
              raise SystemExit('6679: canonical Perps PAPER close owner missing')
          if 'if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(' not in close:
              raise SystemExit('6679: Perps explicit outcome publisher is not live-only')
          if 'modeStr248' in close:
              raise SystemExit('6679: mutable Perps terminal journal mode survived')
          close_fluid_count = close.count('FluidLearning.recordPaperSell(')
          if close_fluid_count != 1:
              raise SystemExit(f'6679: Perps close has {close_fluid_count} FluidLearning SELL fanouts, expected 1')
          journal_check = close.split('// V5.0.6679 — PAPER is already journaled', 1)[-1].split('\n        save()', 1)[0]
          if 'if (!position.isPaper) try {' not in journal_check:
              raise SystemExit('6679: Perps direct journal is not live-only')
          if 'mode             = "live",' not in journal_check:
              raise SystemExit('6679: Perps live journal lost immutable live mode')
          perps_path.write_text(perps)

          # Tokenized stock PAPER also settles through CanonicalPaperTransaction6486;
          # its explicit CanonicalPublishHelper event must therefore be LIVE-only.
          stock = stock_path.read_text()
          stock_marker = '        val stockExitTs6564 = System.currentTimeMillis()'
          stock_start = stock.index(stock_marker)
          stock_call = '        com.lifecyclebot.engine.CanonicalPublishHelper.publishExit('
          stock_call_at = stock.index(stock_call, stock_start)
          stock_call_end = stock.index('\n        )', stock_call_at) + len('\n        )')
          stock_block = stock[stock_start:stock_call_end]
          stock_publish_count = stock_block.count(stock_call)
          if stock_publish_count != 1:
              raise SystemExit(f'6679: expected one tokenized-stock explicit outcome publisher, found {stock_publish_count}')
          stock_block = stock_block.replace(
              stock_call,
              '        if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(',
              1,
          )
          stock = stock[:stock_start] + stock_block + stock[stock_call_end:]
          if 'if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(' not in stock:
              raise SystemExit('6679: tokenized-stock explicit outcome publisher is not live-only')
          stock_path.write_text(stock)

          # Permanent anti-regression contract. Construct line-by-line so this
          # one-shot workflow cannot be broken by YAML indentation in a Python
          # triple-quoted string.
          guard = guard_path.read_text()
          if 'PERPS_PAPER_OUTCOME_SINGLE_PUBLISHER_6679' not in guard:
              insertion = guard.index('    # A prior Golden Tape assertion')
              contract_lines = [
                  '    perps_ai = (SRC / "com/lifecyclebot/perps/PerpsTraderAI.kt").read_text()',
                  '    perps_close = perps_ai.split("fun closePosition(positionId: String, exitPrice: Double, exitReason: PerpsExitSignal)", 1)[-1]',
                  '    require(errors, perps_close, "if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(", "PERPS_PAPER_OUTCOME_SINGLE_PUBLISHER_6679")',
                  '    forbid(errors, perps_close, "modeStr248", "PERPS_MUTABLE_TERMINAL_MODE_RETIRED_6679")',
                  '    perps_fluid_count = perps_close.count("FluidLearning.recordPaperSell(")',
                  '    if perps_fluid_count != 1:',
                  '        errors.append(f"PERPS_PAPER_FLUID_SINGLE_FANOUT_6679: expected 1 FluidLearning SELL, found {perps_fluid_count}")',
                  '    perps_journal = perps_close.split("// V5.0.6679 — PAPER is already journaled", 1)[-1].split("\\n        save()", 1)[0]',
                  '    require(errors, perps_journal, "if (!position.isPaper) try {", "PERPS_PAPER_JOURNAL_CANONICAL_ONLY_6679")',
                  '    require(errors, perps_journal, \'mode             = "live",\', "PERPS_LEGACY_JOURNAL_LIVE_MODE_6679")',
                  '',
                  '    stock_trader = (SRC / "com/lifecyclebot/perps/TokenizedStockTrader.kt").read_text()',
                  '    require(errors, stock_trader, "if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(", "STOCK_PAPER_OUTCOME_SINGLE_PUBLISHER_6679")',
                  '',
                  '',
              ]
              contract = '\n'.join(contract_lines)
              guard = guard[:insertion] + contract + guard[insertion:]
          guard_path.write_text(guard)
          PY

      - name: Verify authority and patch-rot guards
        working-directory: lifecycle_apk
        run: |
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Commit converged sources and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'AATE Source Convergence'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/source-convergence-6679.yml
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/PerpsTraderAI.kt \
                  lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/TokenizedStockTrader.kt \
                  lifecycle_apk/ci/patch_rot_scan.py
          git commit -m 'fix: converge paper outcome publishers [skip-source-convergence-6679]'
          git push origin HEAD:main
