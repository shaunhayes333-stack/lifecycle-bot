name: One-shot source convergence 6679

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-convergence-6679.yml'

permissions:
  contents: write

jobs:
  converge-outcomes:
    if: ${{ !contains(github.event.head_commit.message, '[skip-source-convergence-6679]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Converge paper outcome publishers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('lifecycle_apk')
          perps_path = root / 'app/src/main/kotlin/com/lifecyclebot/perps/PerpsTraderAI.kt'
          stock_path = root / 'app/src/main/kotlin/com/lifecyclebot/perps/TokenizedStockTrader.kt'
          guard_path = root / 'ci/patch_rot_scan.py'

          # Perps: CanonicalPaperTransaction6486.close already journals and its
          # TradeHistoryStore projection publishes the canonical outcome bus.
          perps = perps_path.read_text()
          old_publish = '        com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(\n            tradeIdSeed = trade.id,'
          new_publish = '        if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(\n            tradeIdSeed = trade.id,'
          if perps.count(old_publish) != 1:
              raise SystemExit(f'6679: expected one unguarded Perps outcome publisher, found {perps.count(old_publish)}')
          perps = perps.replace(old_publish, new_publish, 1)

          old_journal_head = '''        // V5.9.248: Wire perps trades into shared journal (live + paper tabs)
          try {
              val modeStr248 = if (position.isPaper) "paper" else "live"
              val dirEmoji = if (position.direction.name == "LONG") "📈" else "📉"
              TradeHistoryStore.recordTrade(Trade(
                  side             = "SELL",
                  mode             = modeStr248,
          '''.replace('\n          ', '\n')
          new_journal_head = '''        // V5.0.6679 — PAPER is already journaled by CanonicalPaperTransaction6486.close.
          // Keep this legacy presentation receipt LIVE-only; otherwise it creates an
          // unkeyed second SELL and a second CanonicalOutcomeBus terminal event.
          if (!position.isPaper) try {
              val dirEmoji = if (position.direction.name == "LONG") "📈" else "📉"
              TradeHistoryStore.recordTrade(Trade(
                  side             = "SELL",
                  mode             = "live",
          '''.replace('\n          ', '\n')
          if perps.count(old_journal_head) != 1:
              raise SystemExit(f'6679: expected one Perps legacy journal head, found {perps.count(old_journal_head)}')
          perps = perps.replace(old_journal_head, new_journal_head, 1)

          duplicate_fluid = '''                // V5.9.8: Sync to FluidLearning shared pool
                          try {
                              val pnlSolVal = pnlSol
                              if (position.isPaper) com.lifecyclebot.engine.FluidLearning.recordPaperSell(position.market.symbol, position.sizeSol, pnlSolVal)
                          } catch (_: Exception) {}
          '''.replace('\n                          ', '\n')
          if perps.count(duplicate_fluid) != 1:
              raise SystemExit(f'6679: expected one duplicate Perps FluidLearning fanout, found {perps.count(duplicate_fluid)}')
          perps = perps.replace(
              duplicate_fluid,
              '                // V5.0.6679: paper FluidLearning SELL is recorded once on the synchronous close path.\n',
              1,
          )

          close = perps.split('fun closePosition(positionId: String, exitPrice: Double, exitReason: PerpsExitSignal)', 1)[-1]
          if 'if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(' not in close:
              raise SystemExit('6679: Perps outcome publisher is not live-only')
          if 'if (!position.isPaper) try {\n            val dirEmoji' not in close:
              raise SystemExit('6679: Perps direct journal is not live-only')
          if 'modeStr248' in close:
              raise SystemExit('6679: mutable Perps journal mode patch survived')
          if close.count('FluidLearning.recordPaperSell(') != 1:
              raise SystemExit(f'6679: Perps close has {close.count("FluidLearning.recordPaperSell(")} FluidLearning SELL fanouts, expected 1')
          perps_path.write_text(perps)

          # Tokenized stocks use the same canonical paper close, so their
          # explicit CanonicalPublishHelper terminal is also live-only.
          stock = stock_path.read_text()
          old_stock_publish = '        com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(\n            tradeIdSeed = "${position.id}_$stockExitTs6564",'
          new_stock_publish = '        if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(\n            tradeIdSeed = "${position.id}_$stockExitTs6564",'
          if stock.count(old_stock_publish) != 1:
              raise SystemExit(f'6679: expected one unguarded stock outcome publisher, found {stock.count(old_stock_publish)}')
          stock = stock.replace(old_stock_publish, new_stock_publish, 1)
          if 'if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(' not in stock:
              raise SystemExit('6679: tokenized-stock outcome publisher is not live-only')
          stock_path.write_text(stock)

          # Repository-level ratchet for these exact authority contracts.
          guard = guard_path.read_text()
          contract = '''    perps_ai = (SRC / "com/lifecyclebot/perps/PerpsTraderAI.kt").read_text()
              perps_close = perps_ai.split("fun closePosition(positionId: String, exitPrice: Double, exitReason: PerpsExitSignal)", 1)[-1]
              require(errors, perps_close, "if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(", "PERPS_PAPER_OUTCOME_SINGLE_PUBLISHER_6679")
              require(errors, perps_close, "if (!position.isPaper) try {\\n            val dirEmoji", "PERPS_PAPER_JOURNAL_CANONICAL_ONLY_6679")
              forbid(errors, perps_close, "modeStr248", "PERPS_MUTABLE_TERMINAL_MODE_RETIRED_6679")
              if perps_close.count("FluidLearning.recordPaperSell(") != 1:
                  errors.append(f"PERPS_PAPER_FLUID_SINGLE_FANOUT_6679: expected 1 FluidLearning SELL, found {perps_close.count('FluidLearning.recordPaperSell(')}")

              stock_trader = (SRC / "com/lifecyclebot/perps/TokenizedStockTrader.kt").read_text()
              require(errors, stock_trader, "if (!position.isPaper) com.lifecyclebot.engine.CanonicalPublishHelper.publishExit(", "STOCK_PAPER_OUTCOME_SINGLE_PUBLISHER_6679")

          '''.replace('\n              ', '\n')
          if 'PERPS_PAPER_OUTCOME_SINGLE_PUBLISHER_6679' not in guard:
              insertion = guard.index('    # A prior Golden Tape assertion')
              guard = guard[:insertion] + contract + guard[insertion:]
          guard_path.write_text(guard)
          PY

      - name: Verify authority and patch-rot guards
        working-directory: lifecycle_apk
        run: |
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Commit converged sources and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'AATE Source Convergence'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/source-convergence-6679.yml
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/PerpsTraderAI.kt \
                  lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/perps/TokenizedStockTrader.kt \
                  lifecycle_apk/ci/patch_rot_scan.py
          git commit -m 'fix: converge paper outcome publishers [skip-source-convergence-6679]'
          git push origin HEAD:main
