name: Cortex source review 8077
on:
  push:
    branches: ['repair/8076-exit-integrity']
    paths: ['.github/workflows/cortex-source-review-8077.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export exact repair source and original comparison base
        run: |
          git rev-parse HEAD > /tmp/aate-source-head.txt
          git archive --format=tar.gz -o /tmp/aate-source-current.tar.gz HEAD lifecycle_apk ci .github AATE_VERSION
          git archive --format=tar.gz -o /tmp/aate-source-c75.tar.gz c75d3b19187221987eae6c2bd2b57fee413c7ee6 lifecycle_apk ci .github AATE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: aate-source-cortex-review
          path: /tmp/aate-source-*
          retention-days: 1
