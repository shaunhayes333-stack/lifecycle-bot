name: Apply V5.0.6715 Source Repair

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply_v5_0_6715.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifecycle_apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Apply staged 6715 source repair
        run: python3 ci/v5_0_6715_trade_one_causal_authority.py

      - name: Reconcile 6715 reset and superseded invariants
        run: python3 ci/v5_0_6715_verification_reconcile.py

      - name: Verify 6715 production source actually exists
        run: |
          test -f app/src/main/kotlin/com/lifecyclebot/engine/truth/CausalFeedbackAuthority6715.kt
          grep -q 'EXEC_OPEN_BLOCKED_CAUSAL_FEEDBACK_6715' app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          grep -q 'CausalFeedbackAuthority6715.resetForTest6715' app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          grep -q 'CausalFeedbackAuthority6715.markLearned' app/src/main/kotlin/com/lifecyclebot/engine/truth/AateDecisionEnvelope6512.kt
          grep -q 'TRADE_ONE_CATASTROPHIC_PNL = -25.0' app/src/main/kotlin/com/lifecyclebot/engine/learning/TacticSwitcher.kt

      - name: Static authority checks
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Unit-test generated source before commit
        run: |
          chmod +x gradlew || true
          mkdir -p gradle/wrapper
          curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6715 -PaateVersionName=5.0.6715

      - name: Commit verified 6715 production source
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lifecycle_apk/app/src/main lifecycle_apk/app/src/test
          if git diff --cached --quiet; then
            echo 'No generated source changes found; refusing false apply.'
            exit 1
          fi
          git commit -m 'V5.0.6715 apply trade-one causal authority repair'
          git push origin HEAD:main
