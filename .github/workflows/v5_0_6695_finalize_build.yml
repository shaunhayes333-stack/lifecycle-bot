name: V5.0.6695 Finalize Repaired APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'V5.0.6695 finalize repaired APK build')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lifecycle_apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Repair stale Golden Tape 6570 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt')
          s = p.read_text()
          old = '''        assertTrue(crypto.contains("markEvaluationProgress6570(refreshed") && crypto.contains("markEvaluationDisposition6567(observedTok6569") &&
              crypto.contains("SHARED_INTELLIGENCE_BACKLOG_COALESCED"))'''
          new = '''        assertTrue(crypto.contains("markEvaluationProgress6570(refreshed") &&
              crypto.contains("markEvaluationProgress6570(observedTok6569, \\\"SHARED_INTELLIGENCE_BACKLOG_COALESCED\\\")"))
          assertFalse(crypto.contains("markEvaluationDisposition6567(observedTok6569, \\\"SHARED_INTELLIGENCE_BACKLOG_COALESCED\\\")"))'''
          if old not in s:
              raise SystemExit('stale Golden Tape assertion not found exactly')
          p.write_text(s.replace(old, new, 1))
          print('Golden Tape 6570 backlog contract updated')
          PY

      - name: Static authority and patch-rot scans
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Full release tests and APK assembly
        env:
          AATE_BUILD_NUMBER: '6695'
          AATE_VERSION_NAME: '5.0.6695'
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6695 -PaateVersionName=5.0.6695
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=6695 -PaateVersionName=5.0.6695
          python3 ci/build_gate_summary.py
          test -f app/build/outputs/apk/release/AATE_v5.0.6695.apk
          ls -lh app/build/outputs/apk/release/AATE_v5.0.6695.apk

      - name: Upload actual repaired APK
        uses: actions/upload-artifact@v4
        with:
          name: AATE_v5.0.6695
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v5.0.6695.apk
          if-no-files-found: error

      - name: Commit regression repair and remove temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/GoldenTapeRegressionTest.kt
          git rm .github/workflows/v5_0_6695_finalize_build.yml
          git diff --cached --check
          git commit -m "V5.0.6695 align Golden Tape with backlog defer authority"
          git push origin HEAD:main
