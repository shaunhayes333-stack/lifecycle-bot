name: One-Shot V5.0.6734 Recovery Authority Repair V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_v5_0_6734_recovery_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aate-v5-0-6734-recovery-v2
  cancel-in-progress: false

jobs:
  recovery_repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Apply guarded source repair
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6734_recovery.py

      - name: Static contradiction and patch-rot checks
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Test adaptive consensus
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.Aate6728AdaptiveConsensusTest

      - name: Test ledger parity and skew
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.Aate6733LedgerParityAndSkewTest

      - name: Test learner revision race
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.Aate6733LearnerRevisionRaceGraceTest

      - name: Test recovery authority
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.Aate6734RecoveryAuthorityTest

      - name: Test execution authority
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.Repair6533ExecutionAuthorityAcceptanceTest

      - name: Test paper mark compatibility
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.BuildRepair6579CoverageTest

      - name: Test causal mark repair
        working-directory: lifecycle_apk
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6734 -PaateVersionName=5.0.6734 --tests com.lifecyclebot.engine.Aate6616CausalP0RepairTest

      - name: Commit repaired source to main
        run: |
          rm -f .github/workflows/one_shot_v5_0_6734_recovery.yml
          rm -f .github/workflows/one_shot_v5_0_6734_recovery_v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'V5.0.6734 repair recovery authority and execution choke'
          git pull --rebase origin main
          git push origin HEAD:main
