name: Prepare final lane alignment
on:
  push:
    branches: ['repair/8076-exit-integrity']
    paths: ['.github/workflows/cortex-final-align-8077.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare assertion-checked final alignment blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,os,urllib.request,base64,tarfile
          K=Path('lifecycle_apk/app/src/main/kotlin/com/lifecyclebot')
          T=Path('lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine')
          paths=[]
          def change(path,old,new):
              text=path.read_text(); assert text.count(old)==1,(str(path),old[:90],text.count(old))
              path.write_text(text.replace(old,new)); paths.append(str(path))
          p=K/'engine/learning/TacticSwitcher.kt'
          change(p,'if (prior8052 != "initial" && !(prior8052.startsWith("seed8049:") && !prior8052.endsWith("|8052"))) return','if (!com.lifecyclebot.engine.cortex.LaneEvidence8077.refreshUntrainedSeed(prior8052, cell.tradesSinceRotation.get())) return')
          change(p,'val reason = "seed8049:${best?.first ?: "lane_default"}|8052"','val reason = "seed8049:${best?.first ?: "lane_default"}|8077"')
          change(p,'val l = lane.uppercase()','val l = com.lifecyclebot.engine.truth.CanonicalLaneIdentity6506.canonical(lane)')
          change(p,'s == "SPECIALIST_EDGE" || s == "EXPERT_ENTRY"','s == "SPECIALIST_EDGE" || s == "EXPERT_ENTRY" || s == "LAUNCH_LADDER_PROVEN"')
          change(p,'// V5.0.8052 — cells 8049/8051 seeded on a noisy 1-4 label setup are seeded again (once) on the corrected pick.','// 8077: refresh old defaults only before completed-trade evidence exists; preserve learned tactics.')
          p=K/'engine/cortex/LaneEvidence8077.kt'; text=p.read_text(); at=text.rfind('\n}'); assert at>0
          text=text[:at]+'''
              /** Correct old defaults only before they carry completed-trade evidence. */
              fun refreshUntrainedSeed(reason: String, tradesSinceRotation: Int): Boolean =
                  tradesSinceRotation == 0 && (reason == "initial" || (reason.startsWith("seed8049:") && !reason.endsWith("|8077")))
          '''+text[at:]
          p.write_text(text); paths.append(str(p))
          change(K/'engine/cortex/CortexLedger7885.kt','voterId.startsWith("PLAYBOOK_SETUP")','voterId.contains("PLAYBOOK_SETUP")')
          p=T/'Aate8077StrategyAlignmentTest.kt'; text=p.read_text(); at=text.rfind('\n}'); assert at>0
          text=text[:at]+'''
              @Test fun aliasesAndUntrainedDefaultsRetainTheirLaneAndCompletedEvidence() {
                  assertEquals(Tactic.PULLBACK, TacticSwitcher.seedTactic8049("BLUE_CHIP", "SPECIALIST_EDGE"))
                  assertEquals(Tactic.PULLBACK, TacticSwitcher.seedTactic8049("BLUE CHIP", "NO_TRIGGER"))
                  assertEquals(Tactic.BREAKOUT, TacticSwitcher.seedTactic8049("MOON_SHOT", "LAUNCH_LADDER_PROVEN"))
                  assertEquals(Tactic.REACCUMULATION, TacticSwitcher.seedTactic8049("SHIT_COIN", "LAUNCH_LADDER_PROVEN"))
                  assertTrue(LaneEvidence8077.refreshUntrainedSeed("initial", 0))
                  assertFalse(LaneEvidence8077.refreshUntrainedSeed("initial", 5))
                  assertTrue(LaneEvidence8077.refreshUntrainedSeed("seed8049:PLAN_BASE_BREAKOUT|8052", 0))
                  assertFalse(LaneEvidence8077.refreshUntrainedSeed("seed8049:PLAN_BASE_BREAKOUT|8052", 1))
                  assertFalse(LaneEvidence8077.refreshUntrainedSeed("seed8049:PLAN_BASE_BREAKOUT|8077", 0))
                  assertFalse(LaneEvidence8077.refreshUntrainedSeed("bayes:loss", 0))
                  val l = CortexLedger7885()
                  repeat(60) { l.lane("QUALITY").add(0.0, false); l.lane("MOONSHOT").add(0.0, false) }
                  repeat(60) { l.seat("X_PLAYBOOK_SETUP_V3__PRICE", "QUALITY", 2).bins[0].add(100.0, true) }
                  assertEquals(0.0, l.predict("X_PLAYBOOK_SETUP_V3__PRICE", "MOONSHOT", doubleArrayOf(0.5), 0.0).netPct, 1e-12)
              }
          '''+text[at:]
          p.write_text(text); paths.append(str(p))
          p=Path('lifecycle_apk/audits/cortex_8077_alignment.md')
          p.write_text(p.read_text()+'\nFinal alignment: canonical lane aliases are used for tactic defaults. Generic launch-ladder setups preserve lane-native tactics. Untrained legacy seeds refresh once; any completed-trade evidence prevents reseeding. Crossed playbook ordinal voters are also lane-local. Ten local numeric groups pass, including extracted production tactic mapping and actual canonical lane identity; full Android CI remains the release check.\n'); paths.append(str(p))
          for scan in ('comment_balance.py','authority_contradiction_scan.py','economic_units_scan.py'):
              args=['python3','ci/'+scan]+(['app/src'] if scan=='comment_balance.py' else [])
              subprocess.run(args,cwd='lifecycle_apk',check=True)
          own='.github/workflows/cortex-final-align-8077.yml'
          subprocess.run(['git','rm',own],check=True)
          paths=sorted(set(paths)); subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          tree=[]; api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          for name in paths:
              data={'content':base64.b64encode(Path(name).read_bytes()).decode(),'encoding':'base64'}
              req=urllib.request.Request(api+'/git/blobs',data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response: blob=json.load(response)
              tree.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          tree.append({'path':own,'mode':'100644','type':'blob','sha':None})
          out=Path('/tmp/cortex-final-8077'); out.mkdir()
          manifest={'parent_sha':git('rev-parse','HEAD'),'base_tree_sha':git('rev-parse','HEAD^{tree}'),'tree_elements':tree,'source_checks':'passed','branch_updated':False}
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          with tarfile.open(out/'source.tar.gz','w:gz') as tar:
              for root in ('lifecycle_apk','ci','.github','AATE_VERSION'): tar.add(root,arcname=root)
          print(json.dumps(manifest,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: aate-final-alignment-8077
          path: /tmp/cortex-final-8077/
          retention-days: 2
