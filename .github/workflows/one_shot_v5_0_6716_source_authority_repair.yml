name: One-Shot Source Authority Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one_shot_v5_0_6716_source_authority_repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source_repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Consolidate production authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gate_path = Path('lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt')
          gate = gate_path.read_text()

          old_return = '                        return "EXEC_OPEN_DROPPED_TOKEN_STATE_CHANGED" to\n                            "FROZEN_SNAPSHOT_NEEDS_REVALIDATION_6627"'
          new_return = '                        try { PipelineHealthCollector.labelInc("EXEC_FROZEN_LOCAL_INTENT_DEFERRED_TO_CALLER_6716") } catch (_: Throwable) {}\n                        return null'
          if gate.count(old_return) != 1:
              raise SystemExit(f'frozen local-intent return count={gate.count(old_return)}, expected=1')
          gate = gate.replace(old_return, new_return, 1)

          causal_re = re.compile(r'        // V5\.0\.6715 — TRADE-ONE CAUSAL FINALITY\..*?\n        val claimKey6487 = executableClaimKey6487', re.S)
          causal_replacement = '\n'.join([
              '        // V5.0.6716 — SOURCE AUTHORITY CONSOLIDATION.',
              '        // Existing AATE intelligence and owner-bound learning remain authoritative.',
              '        // 6715 feedback bookkeeping is diagnostic only; it may not veto a sealed',
              '        // FDG/ExecutionIntent decision or starve the existing closed learning loop.',
              '        try { PipelineHealthCollector.labelInc("CAUSAL_FEEDBACK_GATE_RETIRED_6716") } catch (_: Throwable) {}',
              '',
              '        val claimKey6487 = executableClaimKey6487',
          ])
          gate, n = causal_re.subn(causal_replacement, gate, count=1)
          if n != 1:
              raise SystemExit(f'causal admission block replacement count={n}, expected=1')
          gate_path.write_text(gate)

          t6715_path = Path('lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6715TradeOneCausalAuthorityTest.kt')
          t6715 = t6715_path.read_text()
          old = '        assertTrue(gate.contains("EXEC_OPEN_BLOCKED_CAUSAL_FEEDBACK_6715"))\n'
          new = '        assertTrue(gate.contains("CAUSAL_FEEDBACK_GATE_RETIRED_6716"))\n        assertFalse("6715 feedback bookkeeping must not remain an economic execution blocker", gate.contains("EXEC_OPEN_BLOCKED_CAUSAL_FEEDBACK_6715"))\n'
          if old not in t6715:
              raise SystemExit('expected 6715 production-gate assertion not found')
          t6715_path.write_text(t6715.replace(old, new, 1))

          t6627_path = Path('lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6627CausalAuthorityRepairCoverageTest.kt')
          t6627 = t6627_path.read_text()
          old = '        assertTrue("V5.0.6627 §1: frozen snapshot fast-path must consult ExecutionIntent authority",\n            src.contains("EXEC_FROZEN_SNAPSHOT_MISSING_INTENT_NEEDS_REVALIDATION_6627") &&\n                src.contains("FROZEN_SNAPSHOT_NEEDS_REVALIDATION_6627"))\n'
          new = '        assertTrue("V5.0.6716: frozen helper must defer final seal authority to its caller",\n            src.contains("EXEC_FROZEN_SNAPSHOT_MISSING_INTENT_NEEDS_REVALIDATION_6627") &&\n                src.contains("EXEC_FROZEN_LOCAL_INTENT_DEFERRED_TO_CALLER_6716") &&\n                src.contains("FDG_ALLOW_WITHOUT_EXECUTION_INTENT_6519"))\n'
          if old not in t6627:
              raise SystemExit('expected 6627 source assertion not found')
          t6627_path.write_text(t6627.replace(old, new, 1))

          old_apply = Path('.github/workflows/apply_v5_0_6715.yml')
          if old_apply.exists():
              old_apply.unlink()

          build_path = Path('.github/workflows/build.yml')
          build = build_path.read_text()
          build = build.replace('# V5.0.6715 — verified production-source rebuild trigger; source authority remains the highest applied V5.0.xxxx commit.', '# V5.0.6716 — source-authority consolidation; existing intelligence and learning retained, contradictory execution blockers removed.', 1)
          build_path.write_text(build)

          final_gate = gate_path.read_text()
          required = [
              'CAUSAL_FEEDBACK_GATE_RETIRED_6716',
              'EXEC_FROZEN_LOCAL_INTENT_DEFERRED_TO_CALLER_6716',
              'EXEC_INTENT_SYNTHESIZED_FROM_SEAL_6673',
              'EXEC_SEALED_ENVELOPE_HONOURED_6608',
              'FDG_ALLOW_WITHOUT_EXECUTION_INTENT_6519',
          ]
          missing = [x for x in required if x not in final_gate]
          if missing:
              raise SystemExit('missing source authorities: ' + ','.join(missing))
          if 'EXEC_OPEN_BLOCKED_CAUSAL_FEEDBACK_6715' in final_gate:
              raise SystemExit('6715 economic blocker still present')
          print('source authority consolidation: PASS')
          PY

      - name: Static contradiction checks
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Targeted causal learning tests
        working-directory: lifecycle_apk
        run: |
          chmod +x gradlew || true
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6716 -PaateVersionName=5.0.6716 --tests com.lifecyclebot.engine.Aate6627CausalAuthorityRepairCoverageTest --tests com.lifecyclebot.engine.Aate6681CausalPolicyLearningTest --tests com.lifecyclebot.engine.Aate6713CausalLearningCoreTest --tests com.lifecyclebot.engine.Aate6715TradeOneCausalAuthorityTest

      - name: Commit consolidated production source
        run: |
          rm -f .github/workflows/one_shot_v5_0_6716_source_authority_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'V5.0.6716 consolidate existing learning and execution authority'
          git push origin HEAD:main
