name: V5.0.6692 Source Repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'V5.0.6692 run guarded source repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source transforms
        run: python3 lifecycle_apk/ci/v5_0_6692_apply.py

      - name: Run source authority scans
        working-directory: lifecycle_apk
        run: |
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py

      - name: Commit repaired source atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6692_source_repair.yml
          git rm lifecycle_apk/ci/v5_0_6692_apply.py
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/SlotHealthGate.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/ExecutableOpenGate.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/CanonicalPaperTransaction6486.kt
          git add lifecycle_apk/app/src/main/kotlin/com/lifecyclebot/engine/truth/EconomicPurityGate6504.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6689InventoryTurnoverCompoundingTest.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6659CryptoRoundTripReconciliationTest.kt
          git add lifecycle_apk/app/src/test/kotlin/com/lifecyclebot/engine/Aate6692RuntimeRepairTest.kt
          git diff --cached --check
          git commit -m "V5.0.6692 repair execution authority and paper economics"
          git push origin HEAD:main
