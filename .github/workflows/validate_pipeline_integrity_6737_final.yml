name: Validate pipeline integrity 6737 final

on:
  push:
    branches: ['repair/6737-pipeline-integrity-20260912']
    paths: ['.github/workflows/validate_pipeline_integrity_6737_final.yml']
permissions:
  contents: write
concurrency:
  group: pipeline-integrity-6737-final
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply hash-verified CI corrections
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/6737-final
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(Path('.github/repair6737/validation-followup.b64').read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='26993ac5871b2ce9bf6e437548dad64ce87d11badc206a87f4373cf115a9bad2'
          manifest=json.loads(raw)
          changes=[]
          for item in manifest['files']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              before=p.read_bytes()
              assert hashlib.sha256(before).hexdigest()==item['before'],f'Concurrent edit: {p}'
              lines=before.decode().splitlines(keepends=True)
              for start,end,text in reversed(item['edits']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=text.splitlines(keepends=True)
              after=''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest()==item['after'],f'Output mismatch: {p}'
              changes.append((p,after))
          for p,after in changes:p.write_bytes(after)
          Path('/tmp/6737-final/manifest.json').write_bytes(raw)
          Path('/tmp/6737-final/changed-paths.txt').write_text('\n'.join(str(p) for p,_ in changes)+'\n')
          print('Verified and applied',len(changes),'source/test files')
          PY
          git diff --check
          git add --pathspec-from-file=/tmp/6737-final/changed-paths.txt
          git rm .github/repair6737/validation-followup.b64 .github/workflows/validate_pipeline_integrity_6737_final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V5.0.6737 validate risk precision, retryable resource deferrals and replacement regression contracts'
          git rev-parse HEAD > /tmp/6737-final/source-sha.txt
          git push origin HEAD:refs/heads/repair/6737-pipeline-integrity-20260912
          echo "Tested source $(git rev-parse HEAD); main is unchanged by this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Source authority and patch-rot checks
        working-directory: lifecycle_apk
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/golden_tape_literal_scan.py
          python3 ci/authority_contradiction_scan.py
          python3 ci/patch_rot_scan.py
      - name: Full release unit suite
        working-directory: lifecycle_apk
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p gradle/wrapper
          curl --fail --retry 3 -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace -PbuildNumber=6737 -PaateVersionName=5.0.6737 2>&1 | tee /tmp/6737-final/unit.log
      - name: Assemble reviewed release
        working-directory: lifecycle_apk
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=6737 -PaateVersionName=5.0.6737 2>&1 | tee /tmp/6737-final/build.log
          python3 ci/build_gate_summary.py
      - name: Verify build did not overwrite source repairs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('/tmp/6737-final/manifest.json').read_text())
          bad=[x['path'] for x in m['files'] if hashlib.sha256(Path(x['path']).read_bytes()).hexdigest()!=x['after']]
          Path('/tmp/6737-final/source-overwrites.txt').write_text('\n'.join(bad) if bad else 'No reviewed source files overwritten.\n')
          assert not bad,bad
          PY
          git diff --name-only > /tmp/6737-final/generated-changes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aate-6737-final-validation-${{ github.run_id }}
          path: |
            /tmp/6737-final/
            lifecycle_apk/app/build/test-results/
            lifecycle_apk/app/build/reports/tests/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AATE_v5.0.6737_validated
          path: lifecycle_apk/app/build/outputs/apk/release/AATE_v5.0.6737.apk
          if-no-files-found: error
