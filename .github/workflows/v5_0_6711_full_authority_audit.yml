name: V5.0.6711 Full Authority Chain Audit

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  audit:
    if: contains(github.event.head_commit.message, 'run 6711 full authority audit')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate full semantic authority audit
        working-directory: lifecycle_apk
        run: python3 ci/v5_0_6711_full_authority_audit.py

      - name: Commit audit report and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v5_0_6711_full_authority_audit.yml
          git add lifecycle_apk/audits/v5_0_6711_full_authority_audit.md
          git diff --cached --check
          git commit -m "audit: V5.0.6711 full runtime authority map"
          git push origin HEAD:main
